<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mobilitetsuke</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{
  background:#0d0f13;color:#e8eaed;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit}

/* ---------- liste ---------- */
#list{padding-bottom:130px}
header{position:sticky;top:0;z-index:20;background:#0d0f13;border-bottom:1px solid #232833;padding:env(safe-area-inset-top) 0 0}
.wk{padding:10px 16px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wk b{font-size:15px;color:#ffb454;letter-spacing:.02em}
.wk span{font-size:12px;color:#8b929e}
nav{display:flex;gap:6px;padding:0 12px 10px}
nav button{flex:1;padding:12px 4px;border:1px solid #232833;border-radius:10px;background:#141821;color:#8b929e;font:600 15px/1 inherit}
nav button.on{background:#ffb454;border-color:#ffb454;color:#0d0f13}
.banner{margin:12px;padding:12px 14px;border-radius:12px;background:#1b1508;border:1px solid #3d2f10;font-size:14px;line-height:1.45}
.banner b{color:#ffb454;display:block;margin-bottom:3px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
main{padding:0 12px}
section{margin-bottom:14px;background:#141821;border:1px solid #232833;border-radius:14px;overflow:hidden}
h2{margin:0;padding:13px 15px;font-size:15px;font-weight:700;background:#1a1f29;border-bottom:1px solid #232833;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 em{font-style:normal;font-size:12px;font-weight:600;color:#8b929e;white-space:nowrap}
.ex{display:flex;align-items:flex-start;gap:12px;padding:14px 15px;border-bottom:1px solid #1c212b;cursor:pointer}
.ex:last-child{border-bottom:none}
.bx{flex:none;width:26px;height:26px;margin-top:1px;border-radius:7px;border:2px solid #39414f;display:grid;place-items:center;font-size:15px;color:transparent;transition:.12s}
.ex.done .bx{background:#3ddc84;border-color:#3ddc84;color:#0d0f13}
.ex.done .nm{color:#5d646f;text-decoration:line-through}
.tx{flex:1;min-width:0}
.nm{font-size:15.5px;font-weight:600;line-height:1.35}
.ds{font-size:13.5px;color:#98a0ad;margin-top:3px;line-height:1.45}
.tg{flex:none;align-self:center;padding:6px 10px;border-radius:8px;background:#232a36;color:#9aa3b0;font:600 12px/1 inherit;white-space:nowrap}
.inf{flex:none;align-self:center;width:34px;height:34px;border-radius:50%;border:1px solid #333c4b;background:#1a1f29;color:#9aa3b0;font:700 15px/1 inherit}
.infbox{display:none;padding:0 15px 16px;font-size:14.5px;line-height:1.62;color:#b3bbc8;white-space:pre-line;border-bottom:1px solid #1c212b;background:#11151d}
.infbox.on{display:block}
.infbtn{margin-top:10px;padding:9px 14px;border-radius:9px;border:1px solid #333c4b;background:#1a1f29;color:#9aa3b0;font:700 13px/1 inherit}
#info{display:none;position:fixed;inset:0;z-index:55;background:#0d0f13;padding:env(safe-area-inset-top) 0 0;flex-direction:column}
#info.on{display:flex}
#info h3{margin:0;padding:18px 18px 4px;font-size:21px;font-weight:800;line-height:1.2}
#info .sub{padding:0 18px 12px;font-size:13px;color:#ffb454;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
#info .body{flex:1;overflow-y:auto;padding:0 18px 20px;font-size:15.5px;line-height:1.68;color:#c3cad6;white-space:pre-line;-webkit-overflow-scrolling:touch}
#info .cls{margin:0 18px calc(16px + env(safe-area-inset-bottom));padding:16px;border-radius:12px;border:none;background:#232a36;color:#e8eaed;font:700 15px/1 inherit;flex:none}
.meas{padding:14px 15px;display:flex;flex-direction:column;gap:12px}
.meas label{font-size:14px;color:#c3cad6;display:flex;flex-direction:column;gap:6px}
.meas input{padding:13px 14px;border-radius:10px;border:1px solid #333c4b;background:#0d0f13;color:#e8eaed;font:600 17px/1 inherit}
.meas input::placeholder{color:#4b5563;font-weight:500}
.measnote{font-size:13px;line-height:1.5;color:#ffb454;background:#1b1508;border:1px solid #3d2f10;border-radius:10px;padding:10px 12px;margin-bottom:2px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#11151dee;backdrop-filter:blur(10px);border-top:1px solid #232833;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.bar button{flex:1;padding:15px 8px;border-radius:11px;border:none;font:700 15px/1 inherit;background:#3ddc84;color:#0d0f13}
.bar button.sec{background:#232a36;color:#c3cad6;flex:0 0 76px;font-weight:600}
.bar button.amber{background:#ffb454}

/* ---------- runner ---------- */
#run{display:none;position:fixed;inset:0;z-index:40;background:#0d0f13;flex-direction:column;padding:env(safe-area-inset-top) 16px calc(12px + env(safe-area-inset-bottom))}
#run.on{display:flex}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0 4px;font-size:12px;color:#8b929e;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.rtop button{background:none;border:none;color:#8b929e;font:700 13px/1 inherit;padding:8px 2px}
.rblock{font-size:12.5px;color:#ffb454;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-top:6px}
.rname{font-size:29px;font-weight:800;line-height:1.15;margin:6px 0 8px}
.rdesc{font-size:15px;color:#98a0ad;line-height:1.5}
.rmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0}
.rphase{font-size:14px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#3ddc84}
.rphase.rest{color:#60a5fa}
.rphase.ready{color:#ffb454}
.rnum.idle{color:#4b5563}
.rnum{font-size:clamp(76px,26vw,132px);font-weight:800;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.rnum.warn{color:#ffb454}
.rset{font-size:15px;color:#8b929e;font-weight:600}
.rnext{font-size:13.5px;color:#6b7280;text-align:center;padding:8px 0 4px;min-height:22px}
.rprog{height:5px;border-radius:3px;background:#1c212b;overflow:hidden;margin:8px 0 12px}
.rprog i{display:block;height:100%;background:#3ddc84;width:0;transition:width .3s}
.rctl{display:flex;gap:8px}
.rctl button{flex:1;padding:17px 6px;border-radius:12px;border:1px solid #2a323f;background:#1a1f29;color:#e8eaed;font:700 15px/1 inherit}
.rctl button.main{background:#3ddc84;border-color:#3ddc84;color:#0d0f13;flex:1.5}
.rctl button.main.paused{background:#ffb454;border-color:#ffb454}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(14px);background:#3ddc84;color:#0d0f13;padding:12px 20px;border-radius:11px;font:700 14px/1 inherit;opacity:0;transition:.22s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="list">
  <header>
    <div class="wk"><b id="wkLabel">—</b><span id="dateLabel">—</span></div>
    <nav>
      <button data-d="egen">Egenøkt</button>
      <button data-d="helg">Helg</button>
      <button data-d="lor">Måling</button>
    </nav>
  </header>
  <div class="banner" id="banner"></div>
  <main id="main"></main>
  <div class="bar">
    <button class="sec" id="reset">Nullstill</button>
    <button class="sec" id="copy">Logg</button>
    <button id="start">▶ Start økt</button>
  </div>
</div>

<div id="run">
  <div class="rtop">
    <span id="rCount">—</span>
    <button id="rQuit">Avslutt ✕</button>
  </div>
  <div>
    <div class="rblock" id="rBlock">—</div>
    <div class="rname" id="rName">—</div>
    <div class="rdesc" id="rDesc"></div>
    <button class="infbtn" id="rInfo">ⓘ&nbsp; Teknikk</button>
  </div>
  <div class="rmid">
    <div class="rphase" id="rPhase">ARBEID</div>
    <div class="rnum" id="rNum">0</div>
    <div class="rset" id="rSet"></div>
  </div>
  <div class="rnext" id="rNext"></div>
  <div class="rprog"><i id="rBar"></i></div>
  <div class="rctl">
    <button id="rPrev">◀ Forrige</button>
    <button class="main" id="rPause">Pause</button>
    <button id="rNextBtn">Neste ▶</button>
  </div>
</div>

<div id="info">
  <h3 id="iTitle">—</h3>
  <div class="sub">Teknikk</div>
  <div class="body" id="iBody"></div>
  <button class="cls" id="iClose">Lukk</button>
</div>

<div id="toast"></div>

<script>
"use strict";

/* ======= mobilitetsuke: 2026-10-26 → 2026-11-01 (før blokk 2) ======= */
const VERSION = "v13";          // vises i toppen — så du ser om telefonen kjører gammel bufret versjon
const BLOCK_START = new Date(2026, 8, 7);
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

function weekNo() {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.min(Math.max(Math.floor((t - BLOCK_START) / 6048e5) + 1, 1), 6);
}
/* bailen ligger alltid ett steg foran oppsparket */
function ladder(w) {
  if (w <= 2) return { bail: "Vegg, frontsplitt, vekt ut. Mot slutten av uke 2: prøv 60–80 cm", kick: "Vegg 30–40 cm bak deg" };
  if (w <= 4) return { bail: "60–80 cm. Mot slutten av uke 4: åpent gulv", kick: "Vegg 60–80 cm bak deg" };
  return { bail: "Åpent gulv, fra fritt oppspark", kick: "Åpent gulv" };
}

/* øvelse: [navn, beskrivelse, tid]
   tid = sekunder  ELLER  [serier, arbeid, hvile] */
const HOFTE_HELG = [
  ["Elevated hamstring stretch", "Bøyd kne → strakt, brystet mot låret. 5 dynamiske + 30 sek hold. Annenhver side: H, V, H, V", [4, 60, 10]],

  ["Couch stretch", "Bekkenet tippet bakover, setet stramt. Reis deg bare så langt tippen holder. Annenhver side", [4, 60, 10]]
];
const S = {
  egen: {
    title: "Mobilitet",
    tag: "MOBILITETSUKE",
    logTag: "mobilitetsuke",
    banner: "<b>Mobilitetsuke 26. oktober – 1. november</b>"
      + "Egenøkt mandag, onsdag og torsdag: 20 min håndstand, resten hofte. Fullt blokk 2-program fra 2026-11-02.<br><br>"
      + "<strong style='color:#ffb454'>Stopp-regel: kjenning foran og øverst på høyre skulder — stopp den øvelsen i dag.</strong><br><br>"
      + "Strekk på ca. 7 av 10, i muskelen, aldri i ledd. Prikking eller nervedrag bak kneet: stopp øvelsen.",
    blocks: [
      ["Oppvarming", [
        ["Wrist circles", "Trepunktskontakt: håndrot, puten der fingrene starter, fingertupper. Mest last på puten. 8 sirkler hver vei", 120],
        ["Thoracic extension over foam roller", "Setet i gulvet, ribbeina ned. 3 reps per plassering, to runder opp ryggen", 120],
        ["Inchworm", "Krum ryggen FØR føttene går inn. 4 reps per sett. Skuldrene over hendene", [2, 45, 15]],
        ["Bunny hops", "Hoftene OPP over skuldrene, land mellom hendene. Bortover rommet", [2, 40, 30]]
      ]],
      ["1 · Håndstand — 20 min", [
        ["Free kick-up to handstand", "1 × 5, åpent gulv. Pust ut i sparket. Bare vedlikehold. Stopp ved to dårlige på rad", 180],
        ["Handstand heel pulls", "Ryggen mot veggen, hendene 15–20 cm fra den (mål!). 3 heel pulls per sett, maks 30 sek på hendene. Stopp ved to dårlige sett på rad", [8, 30, 60]]
      ]],
      ["2 · Hofte", [
        ["Hip hinge with dowel", "8 reps, 3 sek ned. Bakhode, skulderblad, korsbein mot skaftet hele veien", [2, 40, 20]]
      ].concat(HOFTE_HELG).concat([
        ["Elevated pancake", "På 5–15 cm forhøyning, bøyde knær. 3 runder contract–relax (press hælene ned 5 sek, slipp, pust ut, gå lenger) + 30 sek hold", [2, 90, 20]],
        ["Seated straddle leg lifts", "8 reps, begge bein, strake knær. Klarer du ikke begge: ett om gangen. Ikke len deg bakover", [3, 40, 40]]
      ])]
    ],
    measNote: "Skriv rått. Heel pulls: per sett, hvor mange av 3 som fikk hælene fra veggen, og beste hold. Kriteriet for når heel pulls sitter, settes etter mandag og onsdag.",
    meas: [
      ["skulder", "Høyre skulder i morges — noe foran og øverst? I ro?", "ingenting"],
      ["kick", "Oppspark 1 × 5 — kom ikke opp / stabilt / for sterk", "2 / 2 / 1"],
      ["avstand", "Heel pulls — avstand håndrot–vegg (cm)", "18"],
      ["heel", "Heel pulls — per sett: fikk hælene fra veggen / beste hold", "2/3 3s · 1/3 2s · …"],
      ["lifts", "Leg lifts — begge bein eller ett? Hvor høyt?", "ett om gangen, 3–5 cm"],

      ["smerte", "Smerte under økta — hvilken øvelse?", "ingen"]
    ]
  },
  helg: {
    title: "Hofte før WOD",
    tag: "MOBILITETSUKE",
    logTag: "mobilitetsuke, hofte før WOD",
    banner: "<b>Lørdag og søndag — 15 min hofte før WOD</b>"
      + "Samme hofteøvelser som i egenøkta, kortversjon. Pancake bare ett sett.<br><br>"
      + "Strekk på ca. 7 av 10, i muskelen, aldri i ledd. Prikking eller nervedrag bak kneet: stopp øvelsen.",
    blocks: [
      ["Hofte — 15 min", HOFTE_HELG.concat([
        ["Elevated pancake", "På 5–15 cm forhøyning, bøyde knær. 3 runder contract–relax + 30 sek hold", 90]
      ])]
    ],
    meas: [
      ["hofte", "Hva var strammest? Kjentes ryggen?", "venstre bakside lår"],

  lor: {

      + "Kl. 09:00, <strong>før WOD</strong>, med hjelper. Samme oppvarming hver gang, <strong>ingen tøying før målingen</strong>.<br><br>"
      + "Datoer: 2026-10-17 (baseline) · 2026-11-14 · 2026-12-12.<br><br>"
      + "3 forsøk per måling, ca. 7 av 10 i strekk, hold 5 sek. Noter alle tre — beste teller. Film fra siden. Skarpt i lysken eller baksiden av låret: stopp.",
    blocks: [
      ["Oppvarming — lik hver gang", [
        ["Row", "Eller bike. Rolig, kun for å bli varm", 300],
        ["Leg swings", "10 fram–bak og 10 side–side per bein", 120],
        ["Air squat", "1 × 15, rolig, full dybde", 60],
        ["Cossack squat", "2 × 5 per side, rolig", 120]
      ]],
      ["1 · Straddle", [
        ["Straddle width test", "Rumpe og rygg inntil vegg. Strake knær, kneskål og tær opp. Hjelperen måler hælavstand, midt hæl til midt hæl", [3, 30, 30]]
      ]],
      ["2 · Pancake", [
        ["Dowel pancake test", "A — nøytral rygg. Mål og noter bredden først, den gjenbrukes hver gang. Kost: bakhode, skulderblad, korsbein. Stopp når én kontakt slipper. Telefon på kosten", [3, 30, 30]],
        ["Pancake test", "B — vanlig pancake, ryggen får runde. Samme bredde. Telefon flatt på korsbeinet, langsiden langs ryggraden", [3, 30, 30]]
      ]]
    ],
    measNote: "Rå tall, alle tre forsøk. Claude regner om straddle til grader (trochanter–gulv 94 cm). Vinkler: mot gulvet, 90° = loddrett.",
    meas: [
      ["tid", "Klokkeslett · før eller etter WOD", "09:00, før WOD"],
      ["straddle", "Straddle — hælavstand × 3 (cm)", "cm / cm / cm"],
      ["bredde", "Pancake-bredde — hælavstand (cm)", "cm"],
      ["pa", "Pancake A, nøytral rygg — kostens vinkel × 3 (°)", "° / ° / °"],

};

/* ===== Utfyllende teknikkbeskrivelser, slått opp på øvelsesnavn =====
   Holdes adskilt fra programmet: kan utvides uten å røre øktene. */
const INFO = {

"Wrist circles + loaded wrist stretch":
"Start på alle fire med håndflatene i gulvet, fingrene fremover. Rull vekten sakte forover og bakover, så sirkler begge veier.\n\nSnu deretter hendene så fingrene peker mot knærne, og len deg forsiktig bakover. Hold 20–30 sek.\n\nTil slutt: håndbaken i gulvet, fingrene mot knærne, lett press.\n\nSkal kjennes som strekk — aldri som stikk. Du har ni måneder med høyt håndvolum uten plager, så dette er vedlikehold, ikke opptrening.",

"Wrist prep":
"Kortversjonen før tyngre økter: sirkler begge veier med håndflatene i gulvet, så fingrene mot knærne og lett press bakover, og til slutt håndbaken ned.\n\nTo til tre minutter er nok. Håndleddene dine tåler belastningen — dette handler om å varme opp leddvæske og senevev, ikke om å tøye.",

"Broomstick shoulder dislocates":
"Bredt grep på kosteskaftet, armene helt strake. Før stanga i en stor bue fra hoftene, over hodet og ned bak ryggen — og samme vei tilbake.\n\nStrake albuer hele veien. Må du bøye, ta bredere grep. Bredden er ikke poenget; den rene bevegelsen er.\n\nRolig tempo, ingen sving.\n\nFormål: åpne og smøre skulderposisjonen du står i når du er opp ned.",

"Band pull-aparts":
"Strikken i strake armer foran deg i brysthøyde. Trekk fra hverandre til strikken berører brystet, og klem skulderbladene sammen.\n\nSkuldrene ned og bort fra ørene hele veien. Kontrollert tilbake — ikke la strikken dra deg.\n\nFormål: bakre skulder og skulderblad. Motvekt til alt pressarbeidet i programmet, og billig forsikring mot skulderplager.",

"Scapula push-ups":
"Push-up-posisjon med armene strake og låst. Bare skulderbladene beveger seg.\n\nSenk brystet noen centimeter ved å la skulderbladene klemme sammen, press så fra deg og skyv dem maksimalt fra hverandre.\n\nAlbuene forblir strake hele tiden. Bøyer du dem, er det en push-up og ikke denne øvelsen.\n\nFormål: kontroll over skulderbladet. Det er fundamentet under en stabil håndstand — uten det kollapser skulderen når du står opp ned.",

"Light push-ups":
"Vanlige push-ups i rolig tempo, godt unna failure. Kroppen rett fra hode til hæl, albuene inn mot 45 grader — ikke rett ut til siden.\n\nFormål her er kun å få blod i skuldre og triceps før tung trening. Dette er ikke et treningssett.",

"Posterior pelvic tilt, wall":
"Stå med ryggen mot veggen, hælene noen centimeter ut. Press korsryggen inn mot veggen ved å rulle bekkenet bakover.\n\nDet er magemusklene og setet som gjør jobben — ikke pusten, og ikke ved å skyve med beina.\n\nHold 3–5 sekunder, slipp helt, gjenta.\n\nDette er den viktigste øvelsen på mandag. Du har stort ekstensjonsrom i korsryggen, og det betyr at kroppen din finner svai av seg selv når du kommer opp ned. Denne bevegelsen er selve motgiften mot banan-håndstanden — og den avlaster ryggen etter markløft samtidig.",

"Dead bug":
"Ligg på rygg med armene rett opp og hofter og knær i 90 grader.\n\nPress korsryggen ned i gulvet og hold den der gjennom hele øvelsen. Senk motsatt arm og bein sakte mot gulvet, tilbake til start, bytt side.\n\nSlipper korsryggen taket i gulvet, har du gått for langt — kort ned bevegelsen til du klarer å holde den.\n\nFormål: holde midtlinjen stabil mens armer og bein beveger seg. Det er nøyaktig det håndstanden krever av deg.",

"Hollow hold":
"Ligg på rygg. Press korsryggen i gulvet, løft skulderbladene og beina fra gulvet, armene strake over hodet.\n\nRibbeina ned, setet strammet. Kroppen skal danne en grunn skål.\n\nKjenner du det i korsryggen, løft beina høyere til svaien forsvinner. Bedre en liten, ren hollow enn en stor med svai.\n\nFormål: hollow er håndstandens form, bare liggende. Klarer du den ikke her, klarer du den ikke opp ned heller.",

"Hollow rock":
"Samme posisjon som hollow hold. Rugg fram og tilbake som en vippestol, med kroppen helt stiv.\n\nBevegelsen kommer fra vektforskyvning, ikke fra å bøye i hofta. Ryker formen, gå tilbake til statisk hold — det er ikke et nederlag, det er riktig dosering.",

"Chest-to-wall handstand hold":
"Gå opp med ansiktet inn mot veggen: start i push-up-posisjon med føttene mot listen, og gå oppover veggen mens hendene nærmer seg.\n\nRibbeina ned, setet strammet, bekkenet tiltet bakover. Press gulvet fra deg gjennom skuldrene og strekk deg så lang du kan. Hælene lett mot veggen — ikke hvilende.\n\nVi bruker bryst-mot-vegg og ikke rygg-mot-vegg med vilje: denne posisjonen tvinger fram riktig linje, mens rygg-mot-vegg lar deg henge i svai og føles lettere enn den er.\n\nRyker linjen før tiden er ute: avslutt settet. Dårlige sekunder fester seg like godt som gode.",

"Crow to headstand press":
"Start i crow: hukende, hendene i gulvet, knærne hvilende på albuene, vekten flyttet fremover, blikket litt frem.\n\nLøft hoftene sakte opp over skuldrene og strekk beina opp til headstand. Ned like kontrollert.\n\nMesteparten av vekten skal ligge i hendene, ikke i issen. Kjennes det i nakken, er vektfordelingen feil — stopp settet.\n\nStrekk helt ut på toppen og hold 5–10 sekunder med bekkenet tiltet og ribbeina nede. Gjør du bare innstigningen og kommer ned igjen, trener du pressmønsteret, men mister linjearbeidet som er hele grunnen til at øvelsen står her.\n\nFormål: linjekontroll og pressmønster. Ikke balansetrening — balansen i headstand overføres ikke til håndstand, fordi basen er en trekant og korrigeringen skjer med kroppen i stedet for fingrene.",

"Glute bridge":
"Ligg på rygg med knærne bøyd og føttene i gulvet. Press gjennom hælene og løft hoftene til kroppen er rett fra kne til skulder.\n\nKlem setet på toppen. Ikke svai i korsryggen for å komme høyere — det er nettopp det vi trener bort.\n\nFormål: setestyrke. Setet er halve jobben med å holde bekkenet i posisjon, både i håndstand og under markløft.",

"Bird dog":
"På alle fire. Strekk motsatt arm og bein ut til vannrett, hold 2–3 sekunder, tilbake.\n\nHoftene skal ikke rotere. Tenk at du balanserer et glass vann på korsryggen.\n\nFormål: stabilitet i korsryggen under bevegelse — direkte relevant for deg, gitt ømheten etter markløft.",

"Side plank":
"På siden, støtt på underarmen med albuen rett under skulderen. Løft hoftene til kroppen er en rett linje sett forfra.\n\nIkke la hofta synke, og ikke la den rotere fremover.\n\nFormål: sidestabilitet i midtpartiet. Det er den som hindrer at du vipper sidelengs når du står frittstående.",

"Passive straddle sit":
"Sitt med beina ut i straddle, så bredt du kommer uten smerte. La overkroppen synke forover og slipp helt.\n\nIngen bounce, ingen aktiv pressing. Tyngdekraften gjør jobben. Pust rolig og la det gi seg litt for hver utpust.\n\nDu ligger på ca. 110 grader. Det er en reell flaskehals for straddle pressen på sikt — men helt irrelevant for julemålet, som er et håndstandshold. Derfor står den som vedlikehold og ikke som fokus.",

"Butterfly stretch":
"Sitt med fotsålene mot hverandre og hælene inn mot kroppen. Slipp knærne ned mot gulvet.\n\nIkke press med albuene. La vekten gjøre jobben.\n\nFormål: innside lår og hofteåpning. Støtter straddle-posisjonen.",

"Swan pose":
"Ligg på magen med hendene under skuldrene, press overkroppen opp mens hoftene blir i gulvet.\n\nDu har mye ekstensjonsrom i korsryggen — gå derfor ikke ut i ytterstilling her. Press heller brystet fremover og oppover enn å presse hoftene ned. Kjenner du klem i korsryggen, har du gått for langt.\n\nFormål: nedkjøling og motbevegelse etter mye hollow-arbeid. Ikke et bevegelighetsmål i seg selv.",

"Dips":
"Fast stativ. Start med strake armer og skuldrene presset ned, bort fra ørene.\n\nSenk kontrollert på tre sekunder til overarmene er omtrent vannrette. Press opp til full lockout.\n\nLener du overkroppen litt fremover, treffer du brystet mer. Helt oppreist treffer du triceps.\n\nUKE 1 ER EN TEST: hvor mange strenge repetisjoner klarer du med full lockout? Det tallet avgjør resten av blokka. Tre eller flere: kjør sett. Under tre: kjør negatives — hopp opp i toppposisjon og senk på fem sekunder.\n\nFormål: inngangen til ring dip. Du klarer én på ringer, og det som mangler er stabilitet like mye som styrke. Fast stativ først, ringer siden.",

"Strict pull-up":
"Full heng i bunn med strake armer. Trekk skulderbladene ned først, deretter albuene. Haka over stanga.\n\nIngen kipping, ingen sprett i bunnen.\n\nSubmaksimalt — aldri til failure. Seks sett à to gir tolv rene repetisjoner, og det bygger mer enn to sett kjørt til utmattelse. Du er på 3–5 strenge; veien til 8–10 går gjennom volum, ikke gjennom å kjøre deg tom.\n\nProgresjon gjennom blokka: 6×2 → 6×3 → 5×4.",

"Strict HSPU":
"Rygg mot vegg, hendene litt bredere enn skulderbredde. Senk kontrollert til hodet berører underlaget, press opp til full lockout.\n\nIngen kipping med hoftene — det er en annen øvelse.\n\nPROGRESJONEN ER ÉN TING: CENTIMETER. Du står på 10 cm (10 kg skive + abmat, målt 2026-09-23 — tidligere anslått til 7). Når 4 × 5 går rent, fjerner du én centimeter.\n\nDet forutsetter at du fordeler: 3 rene reps i alle fire sett, ikke 4-4-3-2. Med fall gjennom settene når du aldri 4 × 5, og da står centimeteren stille.\n\nNoter alltid cm i loggen. Det er ett av de tre tallene vi følger gjennom blokka, og det er en renere måling enn reps — den forteller hvor nær full bevegelsesbane du er.",

"Box pike push-up":
"Føttene på en boks, hoftene høyt, kroppen i en omvendt V. Blikket mot gulvet mellom hendene.\n\nSenk til issen nærmer seg gulvet, press opp. Albuene fremover, ikke ut til siden.\n\nHev boksen når det blir lett — jo mer loddrett kroppen står, jo tyngre blir den.\n\nFormålet er volum, ikke progresjon. Denne ligger under deg på stigen: den belaster rundt halve kroppsvekten, mot HSPUs nær-hele. Men 4 × 3 HSPU gir bare tolv repetisjoner i uka i pressmønsteret, og det er for lite til å bygge fra 3 til 5 reps. Denne fyller hullet på lavere belastning.\n\nInn fra uke 3 — ikke uke 1 og 2, der du fortsatt henter deg inn etter ferien.",

"Pike push-up":
"Føttene i gulvet, hoftene høyt, kroppen i en omvendt V. Gå med hendene så nær føttene at hoftene står over skuldrene så godt det lar seg gjøre. Blikket mot gulvet mellom hendene.\n\nSenk til issen nærmer seg gulvet foran hendene, press opp. Albuene fremover, ikke ut til siden.\n\nTESTUKA: 2 × 8, og siste sett skal ha minst 2 reps igjen. Ingenting til failure. Gjør den vondt i skulderen: stopp øvelsen for i dag.\n\nFormål: holder pressmønsteret i gang mens Strict HSPU er tatt ut av testuka. Lavere belastning enn HSPU, fordi bare deler av kroppsvekten ligger på armene.",

"Ring support hold":
"Hold deg oppe på ringene med helt strake armer. Vri ringene utover så håndflatene peker fremover. Skuldrene ned og bort fra ørene, kroppen stram.\n\nRister du — det er normalt i starten, og det er nettopp stabiliseringsarbeidet som er poenget.\n\nIkke hopp over denne. Du klarer én ring dip, og det er ikke ren pressestyrke som mangler: du klarer tross alt HSPU med 10 cm deficit. Det som mangler er evnen til å stabilisere et underlag som beveger seg. Dette er forutsetningen for ring dip.",

"Tuck compression hold":
"Sitt på blokker eller paralletter med hendene ved hoftene. Press ned og løft setet fra underlaget, trekk knærne inn mot brystet.\n\nAktivt — du skal dra knærne inn mot deg, ikke bare henge med beina i luften.\n\nFormål: kompresjonsstyrken som straddle pressen bygger på. Den har du allerede mer av enn du tror — du presser crow til headstand, og det krever reell kompresjon. Derfor står den som vedlikehold her.",

"Cartwheel bail":
"Velg side på forhånd og bestem deg før du sparker opp.\n\nNår du merker at du passerer vertikalen: vri skulder og hofte mot den valgte siden, la den ene hånda slippe, og sett beina ned i en hjulbevegelse. Se på hendene hele veien.\n\nIkke prøv å komme ned samme vei du kom opp. Det er der folk stivner i luften og lander på ryggen eller vrir håndleddet.\n\nStart der du faktisk er: vegg, beina i frontsplitt, vekten flyttet ut fra veggen. Det er en reell bail, og den behersker du allerede.\n\nBailen skal alltid ligge ett steg foran oppsparket. Du skal ha øvd utgang på en avstand før oppsparket flytter dit — ellers sparker du opp et sted du ikke vet hvordan du kommer ut av, og da trekker du deg, med god grunn.",


"Handstand hops":
"Hendene i gulvet, skulderbredde. Gå med føttene inn til skuldrene står rett over håndleddene, armene loddrette.\n\nHopp opp med samlede, bøyde bein (tuck) og løft hoftene opp over skuldrene. Land mykt på føttene. Små hopp — målet er ikke å komme til håndstand.\n\nSkuldrene står stille over hendene hele veien. Det er hoftene som beveger seg, ikke skuldrene.\n\nFormål: lære å løfte hoftene over skuldrene uten å rotere rundt håndleddene. Det er samme mønster som den nye starten på oppsparket, på lav risiko.",

"Toe pulls, chest-to-wall":
"Gå opp i bryst-mot-vegg-håndstand og flytt hendene nærmere veggen enn vanlig. Løft så én fot av gangen fra veggen og hold 3–5 sekunder.\n\nKorrigér med fingrene, ikke med hoftene. Dette er det viktigste i hele balansearbeidet: håndstandsbalanse sitter i underarmene og fingertuppene. Presser du ned med fingrene, stopper du fallet fremover; slipper du trykket, kommer du tilbake fra overbalanse.\n\nBøyer du i hofta for å korrigere, lærer du en vane du må avlære senere.\n\nFormål: finne balansepunktet med veggen som trygghet.",

"Wall lean-away hold":
"OPPSETT: bryst-mot-vegg med hendene så nær veggen at kroppen står nesten loddrett. Det er avstanden fra hendene til veggen som bestemmer hvor nær balansepunktet du er — ikke en bevegelse du gjør etterpå.\n\nUTFØRELSE: press fingrene ned til tærne nesten ikke har vekt mot veggen. Ingenting skal bevege seg synlig — det som flytter seg, er trykket, fra tærne over i fingrene. Hold der i 5 sekunder. Sitter det, løft tærne én centimeter.\n\nHvorfor ikke «len deg bort»: en stiv kropp kan ikke lene seg bort fra veggen. Med hender og tær i ro kan den bare rotere rundt håndleddene, og da slipper tærne med en gang. Tyngdepunktet flyttes ut bare på tre måter: bøy i hofta (feil — ødelegger linjen), splitt beina (det er toe pulls), eller hendene nærmere veggen (det er oppsettet her).\n\nHofta er låst hele veien. Ribbein ned, sete strammet, bakover-tilt. Kjenner du at du knekker i hofta eller bøyer albuene for å holde deg, er settet over.\n\nRetningen bort fra veggen er overbalanse. Veggen tar deg ikke der — det gjør cartwheel bail.\n\nForskjell fra toe pulls: der flyttes tyngdepunktet med beinet. Her står tyngdepunktet stille, og vekta flyttes over i fingrene.\n\nFormål: akkumulere tid i selve balansepunktet. Du holder 3 × 30 sekunder mot vegg uten problem, så skulderutholdenheten er på plass — det du mangler er tid der balansen faktisk utfordres.",

"Row":
"Romaskin eller bike i 5 minutter, rolig tempo. Du skal bli varm, ikke sliten.\n\nFormål: lik kroppstemperatur hver målelørdag. Bevegelighet varierer med temperaturen, og målingen er bare sammenlignbar hvis oppvarmingen er den samme.",

"Leg swings":
"Stå sidelengs til en vegg eller rigg og hold deg med én hånd. Sving beinet fram og tilbake 10 ganger, med gradvis større utslag. Snu deg mot veggen og sving beinet 10 ganger fra side til side foran kroppen. Bytt bein.\n\nRolig og kontrollert. Ikke kast beinet ut i ytterstilling.\n\nFormål: dynamisk oppvarming av hofta uten statisk tøying før målingen.",

"Air squat":
"Føttene i skulderbreddes avstand, full dybde, rolig tempo. 15 reps.\n\nFormål: varme hofter og knær før målingen.",

"Cossack squat":
"Bred stilling. Sett deg ned på det ene beinet mens det andre står strakt ut til siden med tærne opp. Skift vekten over til den andre siden. 5 per side, 2 runder.\n\nRolig og innenfor komfort. Dette er oppvarming av innsiden av låret, ikke tøying.\n\nFormål: forberede adduktorene på straddle og pancake.",

"Straddle width test":
"OPPSETT: sitt med rumpe og rygg inntil veggen. Veggen låser bekkenet — lener du deg bakover, blir vinkelen kunstig stor.\n\nStrake knær. Kneskål og tær peker rett opp i taket. Ruller knærne framover eller bakover, endres rotasjonen i hofta, og da måler du noe annet.\n\nUTFØRELSE: skyv hælene ut symmetrisk til ca. 7 av 10 i strekk. Hold 5 sek. Hjelperen måler med målebånd fra midten av den ene hælen til midten av den andre, der hælen treffer gulvet.\n\n3 forsøk. Noter alle tre i cm.\n\nOmregning: vinkel = 2 · asin((hælavstand − 17) / 188). 1 cm ≈ 0,6°. 110° ≈ 171 cm. Claude regner om.",

"Dowel pancake test":
"Det viktigste pancake-tallet. Måler hvor langt hofta bøyer seg med nøytral rygg — ikke hvor langt brystet kommer ned.\n\nBREDDE: sitt i pancake-bredden du trener i, strake knær, kneskål opp. Mål hælavstanden og noter den. Samme bredde hver måling.\n\nOPPSETT: hold en kost langs ryggen, én hånd bak nakken og én bak korsryggen. Kosten skal berøre bakhodet, mellom skulderbladene og korsbeinet.\n\nUTFØRELSE: bøy deg framover fra hofta. Stopp i det øyeblikket ett av de tre kontaktpunktene slipper — da har ryggen begynt å runde. Hjelperen legger telefonen på kosten og leser av vinkelen mot gulvet. 90° = loddrett, lavere = dypere.\n\n3 forsøk.\n\nTelefon: iPhone — Måleverktøy, Vater. Android — en vinkelmåler-app som viser 0° på et bord.",

"Pancake test":
"Vanlig pancake, slik du trener den. Ryggen får runde.\n\nSamme bredde som i forrige test.\n\nGå ned til ca. 7 av 10. Hjelperen legger telefonen flatt på korsbeinet — den flate beinplata øverst mellom setemusklene — med langsiden langs ryggraden, og leser av vinkelen mot gulvet.\n\n3 forsøk.\n\nHvorfor: korsbeinet viser hvor mye bekkenet faktisk tipper framover, uansett hvor mye ryggen runder over. Din korsrygg er svært bevegelig og tar ellers bevegelsen. Forskjellen mellom A og B viser hvor mye ryggen bidrar.",

"Frog stand":
"Huk deg ned, hendene i gulvet, knærne hvilende på albuene. Len vekten fremover til føttene letter fra gulvet, og hold.\n\nBlikket litt fremover, ikke rett ned mellom hendene — da tipper du lett over.\n\nLav intensitet i dag. Skuldrene skal være friske til vektløfting i kveld.\n\nFormål: håndbalanse og kompresjon i en lav, trygg posisjon."
,
"Wrist circles":
"FORMÅL: varme opp håndleddene og øve inn trykkfordelingen du skal bruke i håndstand.\n\nSTARTSTILLING: på alle fire, eller i planke hvis det kjennes lett. Hendene rett under skuldrene, fingrene spredt og langfingeren pekende rett fram.\n\nArmene strake. Skyv gulvet bort så skulderbladene glir fra hverandre og ryggen mellom dem ikke synker ned. Ribbeina inn, magen stram. Det er dette som er «hele kroppen aktiv»: kroppen er stiv, og det er bare skuldrene som flytter vekten.\n\nTREPUNKTSKONTAKTEN: tre punkter i gulvet hele tiden — håndroten, puten der fingrene starter og fingertuppene.\n\nMEST LAST PÅ PUTEN DER FINGRENE STARTER. Fingertuppene griper lett i gulvet, som om du prøver å klemme gulvet sammen under hånda, uten at knokene løfter seg.\n\nBEVEGELSEN: flytt hele kroppen i en langsom sirkel over hendene: fram, til siden, bakover og til den andre siden. Det er skuldrene som sirkler. Hendene står helt stille.\n\nNår du flytter vekten fram, øker trykket på puten og fingertuppene. Når du flytter den bakover, øker trykket i håndroten. Ingen av de tre punktene skal løfte seg på noe tidspunkt.\n\n8 sirkler hver vei. Avslutt med 10 sek der du står med vekten litt fram og kjenner at fingrene jobber.\n\nDET DU SKAL KJENNE: at trykket vandrer rundt i hånda mens kontakten med gulvet holder seg. Det er den samme korreksjonen du skal bruke i heel pulls.\n\nFEIL Å SE ETTER: fingrene løfter seg når vekten går bakover, eller skuldrene synker mellom skulderbladene.",

"Thoracic extension over foam roller":
"FORMÅL: bevegelighet i brystryggen, den stive delen fysioen fant. Får brystryggen gi etter, trenger ikke korsryggen å svaie for å få armene over hodet i håndstand.\n\nSTARTSTILLING: ligg på ryggen med skumrulla på tvers under ryggen, omtrent nederst på skulderbladene. Knærne bøyd, føttene i gulvet, SETET I GULVET. Hendene bak hodet, albuene pekende fram, så hendene bærer hodet og nakken ikke henger. Ribbeina ned, magen stram.\n\nBEVEGELSEN: pust ut og len overkroppen bakover over rulla så langt det er komfortabelt. Rulla er et dreiepunkt, og brystryggen bøyer seg bakover rundt den. Hold 2–3 sek, og kom tilbake opp.\n\n3 repetisjoner, så flytter du rulla noen centimeter opp. Start nederst på skulderbladene, avslutt øverst på dem. Gå to runder opp.\n\nHVA STÅR STILLE: setet ligger i gulvet, og ribbeina holdes nede. Det er de to tingene som låser korsryggen, slik at bøyningen må skje i brystryggen.\n\nDET DU SKAL KJENNE: trykk og strekk i øvre del av ryggen, rundt skulderbladene.\n\nFEIL Å SE ETTER: setet løfter seg, eller ribbeina spretter opp. Da svaier korsryggen og tar bevegelsen, og det er akkurat det vi vil unngå. Rulla ligger under korsryggen eller nakken. Den skal ligge mellom nederst og øverst på skulderbladene.",

"Inchworm":
"MED KRUM RYGG — varianten fra håndstandkurset.\n\nFORMÅL: øve inn formen fra pressen: øvre rygg krum, skulderbladene skjøvet fram og hoftene løftet bak deg. Det er motsatt av svaien du har i korsryggen.\n\nSTARTSTILLING: stå med føttene i hoftebredde. Bøy deg fram og sett hendene i gulvet foran føttene. Bøy knærne så mye som trengs.\n\nFØRSTE DEL, UT TIL PLANKE: gå med hendene fram til du står i planke: skuldrene over hendene, armene strake, kroppen rett fra skuldre til hæler. Skyv gulvet bort, ribbeina inn og setet stramt. Hold 2 sek.\n\nANDRE DEL, SAMMEN IGJEN — her ligger fokuset:\n\n1. Krum ryggen før beina beveger seg. Skyv gulvet hardere bort så skulderbladene glir fra hverandre og øvre rygg runder seg opp mot taket. Tipp bekkenet bakover, som i Posterior pelvic tilt, wall, så korsryggen også runder seg. Hoftene løfter seg litt.\n\n2. Gå med føttene inn mot hendene i korte skritt, og hold ryggen krum hele veien. Hoftene stiger mens føttene nærmer seg, og kroppen folder seg sammen som en pike. Hendene står stille.\n\n3. Gå så langt inn som du kommer med krum rygg og strake armer. Reis deg opp, og start neste repetisjon.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: hendene står stille hele tiden. Føttene vandrer, og hoftene stiger. Skuldrene holder seg over hendene eller litt foran dem.\n\nDET DU SKAL KJENNE: at magemusklene og musklene mellom skulderbladene og brystet jobber for å holde krummingen, og at bakside lår strekkes når føttene kommer nær.\n\nFEIL Å SE ETTER: ryggen flater ut eller svaier når føttene går inn. Da er krummingen sluppet — ta kortere skritt. Skuldrene glir langt fram foran hendene. Det belaster fremsiden av skulderen. DENNE UKA: hold skuldrene omtrent over hendene.",

"Bunny hops":
"FORMÅL: vektoverføringen fra Float forward from downward dog: hoftene over skuldrene og vekten over i hendene, bare med fart. Hoppene er første trinn. Etter hvert blir hoppet mindre og tiden på hendene lengre, til du flyter fram uten hopp.\n\nSTARTSTILLING: nær Downward dog, men med føttene gått så langt inn at skuldrene står over håndleddene, som i startstillingen for oppsparket. Hoftene høyt, armene strake. Trepunktskontakt i hendene, mest last på puten der fingrene starter. Blikket i gulvet mellom hendene.\n\nBEVEGELSEN:\n\n1. Bøy knærne litt, og hopp med begge bein samtidig. Hoftene skal OPP, ikke fram. Målet er at hoftene kommer over skuldrene i luften.\n\n2. I luften trekker du knærne inn mot brystet, som i en tuck. Et øyeblikk bærer hendene hele vekten.\n\n3. Land mykt på føttene, MELLOM HENDENE.\n\n4. Gå med hendene fram til startstillingen, og gjenta. Slik kommer du deg bortover rommet.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: hendene står stille mens du hopper. Armene er strake hele tiden. Det er hoftene som flytter seg opp og over hendene.\n\nDET DU SKAL KJENNE: at vekten går over i hendene og at fingrene tar imot. Landingen skal være stille.\n\nFEIL Å SE ETTER: du hopper fram og ikke opp — da lander føttene foran der de var, men hoftene har aldri vært over hendene. Albuene bøyer seg i hoppet. Hard landing betyr at du falt ned fra hoppet i stedet for å kontrollere det.",

"Free kick-up to handstand":
"MOBILITETSUKA: 1 × 5, bare for å holde ved like det du har bygget i blokk 1. Det er ikke trening for å bli bedre denne uka. Fem forsøk, så er det gjort.\n\nOPPSETT: åpent gulv, ingen vegg. Matte der du lander i bailen er valgfritt. Uthvilt, rett etter oppvarmingen.\n\nSTARTSTILLING (fra 2026-10-01): gå med føttene inn til skuldrene står over håndleddene, armene loddrette og hoftene høyt. Trepunktskontakt, mest last på puten der fingrene starter. Starten står stille. Ingen bevegelse bakover og ingen sving. Et forsøk med sving teller ikke.\n\nBEVEGELSEN: pust ut når du sparker opp. Utpusten trekker ribbeina ned og strammer magen, så kroppen er stiv når du kommer opp.\n\nHøyre bein svinger strakt opp. Venstre bein sparker fra gulvet. Hoftene løftes OVER skuldrene, ikke fram. Spark til vertikal. Ikke stopp med vilje på halvveien.\n\nKommer du opp: korriger med fingrene. Går du over: Cartwheel bail, til venstre der det går. Kommer du ikke opp: gå rolig ned igjen.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: hendene og skuldrene står stille. Det er beina som flytter tyngdepunktet opp over hendene.\n\nTELL HVERT FORSØK: kom ikke helt opp / stabilt punkt / for sterk (bail). Skriv for eksempel «2/2/1».\n\nSTOPP-REGLER: to dårlige forsøk på rad (overspark, bail før overbalanse, eller fingrene jobber ikke): stopp der. Kjenning foran og øverst på høyre skulder: stopp øvelsen for dagen.",

"Handstand heel pulls":
"FORMÅL: lære å bli stående ved å korrigere med fingrene. Veggen tar imot det du ikke redder, så du trenger ingen bail og har ingenting å frykte. Det er også første trinn mot Slow kick-up, der hælen så vidt skal berøre veggen.\n\nOPPSETT: hendene ca. 15–20 cm fra veggen, målt fra håndroten. Jo nærmere veggen, jo mindre må du lene deg, og jo lettere er det å komme fra den. MÅL AVSTANDEN FØRSTE GANG, OG HOLD DEN FAST til øvelsen sitter. Noter den.\n\nOPPSPARK: ryggen mot veggen. Spark opp, pust ut, og la hælene legge seg lett mot veggen. Still deg opp i linje: ribbeina ned, bekkenet tippet bakover, setet stramt og beina samlet. Hele kroppen stiv. Trepunktskontakt, mest last på puten der fingrene starter.\n\nÉN HEEL PULL:\n\n1. Press fingrene ned i gulvet. Trykket flyttes fram i hånda, og hele den stive kroppen vipper litt bort fra veggen. Hælene slipper.\n\n2. Hold balansen så lenge du klarer, og korriger med fingrene. Trykk mer med fingertuppene hvis du er på vei tilbake mot veggen. Slipp litt på fingrene, så trykket går mot håndroten, hvis du er på vei bort fra veggen.\n\n3. Når balansen ryker mot veggen, tar veggen imot. Det er hele poenget. Ryker den bort fra veggen, går du rolig ned.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: kroppen er stiv fra hender til tær og vipper som én enhet rundt håndleddene. Det er trykket i hendene som flytter seg. Hoftene skal IKKE bøye seg.\n\nDOSE: ett sett = spark opp, så 3 heel pulls med hælene tilbake til veggen mellom hver, så ned. Maks 30 sek på hendene per sett. Hvile 60 sek. Klokka gir 8 sett.\n\nNOTER PER SETT: hvor mange av de 3 som fikk hælene fra veggen, og beste hold i sekunder. For eksempel «2/3, 3 sek».\n\nNÅR SITTER DEN? Kriteriet settes etter mandag og onsdag, når vi har tall.\n\nFEIL Å SE ETTER: du bøyer i hofta for å få føttene fra veggen. Da slipper beina, men hoftene lener seg bakover mot veggen, og det er ingen balanse. Det er den vanligste juksefeilen. Hele kroppen skal bort fra veggen, ikke bare føttene. Korsryggen svaier og magen henger. Albuene bøyer seg for å redde balansen.\n\nSTOPP-REGLER: to dårlige sett på rad, der ingen av heel pullene får hælene fra veggen eller formen ryker: stopp øvelsen. Kjenning foran og øverst på høyre skulder: stopp øvelsen for dagen.",

"Hip hinge with dowel":
"VIDEO: https://youtu.be/45DQiwq4oKk\nVIDEO: https://youtu.be/t4ouk4TmrS8\n\nFORMÅL: lære å bøye i hofta mens ryggen står helt stille. Det er grunnferdigheten under alle hofteøvelsene som kommer etter. Korsryggen din tar over så lett at du trenger et redskap som sier fra når den gjør det.\n\nSTARTSTILLING: stå med føttene i hoftebredde og knærne myke, litt bøyd. Knevinkelen holdes lik hele veien. Kosteskaftet langs ryggen. Den ene hånda holder det bak nakken, den andre bak korsryggen.\n\nTRE KONTAKTPUNKTER: bakhodet, mellom skulderbladene og korsbeinet. Det skal være en liten åpning ved korsryggen, omtrent en håndflate. Det er den naturlige svaien.\n\nBEVEGELSEN:\n\n1. Skyv hoftene bakover, som om du skal lukke en bildør med rumpa. Overkroppen tipper fram som en planke rundt hofteleddet.\n\n2. Gå ned langsomt, ca. 3 sek, til du kjenner strekk i bakside lår på ca. 7 / 10, eller til et av kontaktpunktene slipper skaftet. Det som kommer først, avgjør.\n\n3. Kom opp ved å skyve hoftene fram.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: bare hofteleddet beveger seg. Ryggen, nakken og knærne står stille. Skaftet viser det: alle tre punktene ligger inntil hele veien, og åpningen ved korsryggen er like stor.\n\nDET DU SKAL KJENNE: strekk i bakside lår, ikke i ryggen.\n\nFEIL Å SE ETTER: korsbeinet slipper skaftet — korsryggen runder seg, og det er nettopp det vi trener bort. Du har gått for langt, snu før det skjer. Åpningen ved korsryggen blir større — du svaier for å komme lenger ned. Bakhodet slipper — nakken bøyer seg. Hold blikket i gulvet ca. 1 m foran deg. Knærne bøyes mer for å komme lenger ned — da blir det en knebøy og ikke en hip hinge.",

"Elevated hamstring stretch":
"BØYD KNE → STRAKT, BRYSTET MOT LÅRET.\n\nFORMÅL: strekke bakside lår med ryggen ute av bevegelsen. Dette er fysioens øvelse slått sammen med varianten som ga deg gjennombruddet i foroverbøyen. Én side om gangen. Det er også fremre bein i frontsplitt.\n\nSTARTSTILLING: den ene foten på en boks, ca. knehøyde eller litt lavere. Foten avslappet, ikke trukket mot deg. Ståbeinet med tærne rett fram og kneet rett, men ikke låst. Hoftene i vater og rett fram. Hofta på boks-siden vil gjerne løfte seg og vri seg utover. Hold den nede.\n\nBEVEGELSEN:\n\n1. Bøy kneet på boksbeinet godt, og fold deg fram fra hofta til brystet ligger mot låret. Hendene på boksen eller på leggen.\n\n2. Pust inn. Hold brystet mot låret, pust ut og strekk kneet langsomt mot rett til du kjenner strekk på ca. 7 / 10.\n\n3. Hold 2–3 sek, og bøy kneet igjen.\n\n4. Gjenta, og gå litt lenger for hver gang: inn og ut av strekket.\n\n5. Den femte repetisjonen holdes i 30 sek. Pust rolig, og gå litt dypere på hver utpust.\n\nDOSE: 2 sett per side, annenhver side. Klokka gir 4 × 60 sek.\n\nPUSTEN: inn når kneet er bøyd, ut når du går inn i strekket. Utpusten får musklene til å slippe. Holder du pusten, strammer kroppen seg og holder igjen.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: brystet og låret er låst sammen, så ryggen kan ikke runde seg mer. Det eneste som beveger seg, er kneet. Når det strekkes, må bakside lår gi etter.\n\nDET DU SKAL KJENNE: strekk i bakside lår, fra setet og ned mot knehasen.\n\nFEIL Å SE ETTER: brystet slipper låret når du strekker kneet — da tar ryggen over. Stopp kneet der brystet fortsatt ligger inntil. Det er grensen din. Hofta på boks-siden løfter seg eller vrir seg utover. Du holder pusten i holdet. Prikking eller nervedrag bak kneet eller ned i leggen: stopp øvelsen. Det er nerven, ikke muskelen.",

"Half split":
"FRA BØYD KNE, BRYSTET MOT FREMRE LÅR.\n\nFORMÅL: samme strekk som Elevated hamstring stretch, men i stillingen fra frontsplitten. Det er denne stillingen ståbeinet ditt er i når du sparker opp: hofta bøyd og kneet strakt. Trenes på begge sider, siden du også vil lære oppspark med venstre bein.\n\nSTARTSTILLING: knestående på bakre kne, med en pute eller matte under. Fremre fot foran deg med hælen i gulvet. To yogablokker, én på hver side av fremre fot, for hendene. Hoftene rett fram, som frontlykter som peker framover. Bakre hofte vil gjerne vri seg utover.\n\nBEVEGELSEN:\n\n1. Fremre kne godt bøyd. Fold deg fram fra hofta til brystet ligger mot fremre lår, med hendene på blokkene.\n\n2. Pust inn. Hold brystet mot låret, pust ut, og skyv hoftene bakover mot bakre kne, så fremre kne strekker seg mot rett. Stopp på ca. 7 / 10.\n\n3. Hold 2–3 sek, og kom tilbake.\n\n4. 5 dynamiske repetisjoner. Den femte holdes i 30 sek, med rolig pust og litt dypere på hver utpust.\n\nDOSE: 2 sett per side, annenhver side. Klokka gir 4 × 60 sek.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: brystet og låret er låst sammen. Hoftene glir bakover, og fremre kne strekker seg. Ryggen står stille.\n\nDET DU SKAL KJENNE: strekk i bakside av fremre lår.\n\nFEIL Å SE ETTER: brystet slipper låret — ryggen tar over. Bakre hofte vrir seg utover, så bekkenet peker skrått. Du holder pusten. Prikking eller nervedrag bak kneet: stopp.",

"Couch stretch":
"BEKKENET TIPPET BAKOVER.\n\nFORMÅL: strekke hoftebøyerne foran på bakre bein i frontsplitten. Det er sparkbeinets side når du sparker opp. Mangler denne, gir korsryggen etter, og du får den kjente svaien. Øvelsen trener også det samme grepet som i håndstand: å tippe bekkenet bakover mens hofta strekkes.\n\nSTARTSTILLING: bakre kne i gulvet inntil en vegg eller en boks, med leggen opp langs veggen og tærne pekende opp. Pute under kneet. Fremre fot i gulvet foran deg, som i et utfall, med kneet over ankelen. Start med overkroppen lent fram og hendene på fremre kne eller på en blokk. Kjennes det for hardt: flytt bakre kne litt bort fra veggen.\n\nBEVEGELSEN:\n\n1. Tipp bekkenet bakover, som i Posterior pelvic tilt, wall: halebeinet under deg og setet på bakre bein strammet. Bare dette gir ofte mye strekk foran på bakre hofte.\n\n2. Hold tippen, og løft overkroppen langsomt mot loddrett, bare så langt som tippen holder.\n\n3. Hold i 60 sek. Pust rolig, og stram setet litt mer på hver utpust.\n\nDOSE: 2 × 60 sek per side, annenhver side.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: bekkenet tipper bakover og holdes der. Korsryggen står stille. Overkroppen reiser seg bare så langt bekkenet tillater.\n\nDET DU SKAL KJENNE: strekk foran på bakre hofte og nedover forsiden av låret.\n\nFEIL Å SE ETTER: korsryggen svaier når du reiser deg. Det er det vanligste for deg. Strekket forsvinner fra hofta og havner i ryggen. Gå tilbake fram og tipp bekkenet på nytt. Ribbeina spretter fram. Setet på bakre bein er slapt — da holder ikke tippen.\n\nHVORFOR IKKE FULL FRONTSPLITT? Det svakeste leddet bestemmer hvor langt du kommer, og korsryggen tar over. Hver del for seg nå, hele splitten som måling.",

"Elevated pancake":
"BØYDE KNÆR → STRAKERE, CONTRACT–RELAX.\n\nFORMÅL: bøye i hofta med nøytral rygg i straddle. Det er her målingen 2026-10-17 stoppet på 90°, altså at hofta ikke bøyde seg forbi sittende loddrett. Det er også stillingen pressen går gjennom.\n\nSTARTSTILLING: sitt på en forhøyning på 5–15 cm, for eksempel en yogablokk eller en sammenbrettet matte. Når setet er høyere enn føttene, er det lettere å tippe bekkenet fram. Beina bredt, men ikke helt ut. Knærne bøyd og hælene i gulvet. Kneskålene peker opp. Sitt på forkant av sittebeina, og tipp bekkenet fram så korsryggen får sin naturlige svai. Ryggen rett. Valgfritt: kosteskaftet langs ryggen, som i Hip hinge with dowel. Det sier fra når ryggen runder seg.\n\nBEVEGELSEN:\n\n1. Med bøyde knær: fold deg fram fra hofta med rett rygg, og gå med hendene fram i gulvet til du kjenner strekk på ca. 7 / 10.\n\n2. CONTRACT–RELAX: press hælene ned i gulvet i 5 sek, som om du prøver å dra dem mot deg. Slipp, pust ut, og gå litt lenger. Enten går hendene litt lenger fram, eller så skyver du hælene litt ut så knærne blir strakere. Ryggen holdes rett.\n\n3. 3 runder contract–relax, og så hold i 30 sek med rolig pust.\n\nDOSE: 2 sett, ca. 1,5 min per sett.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: bekkenet tipper fram rundt hofteleddene, og knærne strekkes gradvis. Ryggen er låst. Når du presser hælene ned, jobber de musklene som strekkes. Når du slipper, gir de etter litt mer. Det er derfor contract–relax virker.\n\nDET DU SKAL KJENNE: strekk i bakside og innside av lårene, ikke i ryggen.\n\nMERK: i Elevated hamstring stretch og Half split låser låret ryggen. Her finnes ingen slik lås, så du må holde ryggen rett selv. Det er derfor skaftet kan være nyttig.\n\nFEIL Å SE ETTER: ryggen runder seg for å komme lenger ned — da er det ryggen som bøyer seg og ikke hofta. Gå tilbake. Kneskålene ruller fram eller bakover. De skal peke opp. Du holder pusten når du presser. Prikking eller nervedrag bak kneet: stopp.",

"Seated straddle leg lifts":
"FORMÅL: styrke i ytterstillingen. Bevegelighet du ikke kan holde med egen kraft, kan du ikke bruke i en press. Når beina skal samles over hodet i pressen, er det hoftebøyerne som må jobbe i nettopp denne stillingen. De andre øvelsene gir mer rom, og denne lærer deg å bruke det.\n\nSTARTSTILLING: sitt på gulvet, uten forhøyning, med beina i straddle så bredt det går med strake knær. Kneskålene og tærne peker opp. Sitt rett opp, med bekkenet tippet fram og ryggen rett. Hendene i gulvet foran deg, mellom beina. Jo lenger fram hendene står, jo mer må hoftene gjøre jobben.\n\nBEVEGELSEN:\n\n1. Løft begge beina fra gulvet, noen få centimeter er nok. Knærne strake.\n\n2. Hold 1–2 sek, og senk dem kontrollert. Ikke slipp dem ned.\n\n3. Klarer du ikke begge: løft ett bein om gangen, vekselvis.\n\nDOSE: 3 × 8. Med ett bein: 3 × 8 per side. NOTER HVILKEN VARIANT DU KLARTE, OG HVOR HØYT BEINA KOM. Det er utgangspunktet.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: bare beina løfter seg. Overkroppen står stille og rett. Hendene er støtte, ikke drivkraft.\n\nDET DU SKAL KJENNE: at det brenner eller krever foran i hofta og øverst på lårene. Krampe foran i hofta er vanlig i starten. Rist den ut og fortsett.\n\nFEIL Å SE ETTER: du lener deg bakover for å få beina opp. Da blir det lettere, men da trener du ikke ytterstillingen. Det er den vanligste juksefeilen. Knærne bøyer seg. Beina ruller så kneskålene peker fram. Ryggen runder seg."

const DAYNAME = { egen: "Egenøkt", helg: "Helg", lor: "Lørdag" };
const DAYMAP = ["egen", "egen", "egen", "egen", "helg", "helg", "helg"]; // man..søn
const MEASURE_DAYS = ["2026-10-17", "2026-11-14", "2026-12-12"];  // målelørdager — appen åpner på «Måling» disse dagene
let day = MEASURE_DAYS.includes(iso(new Date())) ? "lor" : DAYMAP[(new Date().getDay() + 6) % 7];

const key = () => "okt:" + iso(new Date()) + ":" + day;
const load = () => { try { return JSON.parse(localStorage.getItem(key())) || {}; } catch (e) { return {}; } };
const save = s => { try { localStorage.setItem(key(), JSON.stringify(s)); } catch (e) {} };
const mmss = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
/* videolenker i INFO blir klikkbare — åpnes bare ved trykk, appen henter ingenting selv */
const linkify = t => esc(t).replace(/https:\/\/[^\s<]+/g, u => '<a href="' + u + '" target="_blank" rel="noopener" style="color:#ffb454">' + u + "</a>");

/* teknikkpanel — brukes både fra lista og fra runneren */
function visInfo(nm) {
  if (!INFO[nm]) return;
  document.getElementById("iTitle").textContent = nm;
  document.getElementById("iBody").innerHTML = linkify(INFO[nm]);
  document.getElementById("iBody").scrollTop = 0;
  document.getElementById("info").classList.add("on");
}

/* ---------- bygg stegliste for runner ---------- */
function buildSteps() {
  const w = weekNo(), L = ladder(w), out = [];
  let i = 0;
  for (const [bt, list] of S[day].blocks) {
    for (const [nm, ds, t, minWeek] of list) {
      if (minWeek && w < minWeek) continue;   // øvelse som først starter senere i blokka
      const id = "e" + (i++);
      const d = (ds || "").replace("__BAIL__", L.bail).replace("__KICK__", L.kick);
      if (Array.isArray(t)) {
        const [sets, w, r] = t;
        for (let s = 1; s <= sets; s++) {
          out.push({ id, bt, nm, ds: d, sec: w, work: true, set: s, sets });
          if (s < sets) out.push({ id, bt, nm, ds: d, sec: r, work: false, set: s, sets });
        }
      } else {
        out.push({ id, bt, nm, ds: d, sec: t, work: true });
      }
    }
  }
  return out;
}
function totalSec() { return buildSteps().reduce((a, s) => a + s.sec, 0); }

/* ---------- liste ---------- */
function render() {
  const w = weekNo(), L = ladder(w), s = S[day], st = load();
  document.getElementById("wkLabel").textContent = (s.tag || "TESTUKE") + " · " + s.title.toUpperCase();
  document.getElementById("dateLabel").textContent =
    new Date().toLocaleDateString("no-NO", { weekday: "long", day: "numeric", month: "short" })
    + " · " + mmss(totalSec()) + " · " + VERSION;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.d === day));

  document.getElementById("banner").innerHTML = s.banner || "<b>Testuke 19.–25. oktober — høyre skulder</b>"
    + "<strong style='color:#ffb454'>Stopp-regel: gjør en øvelse vondt i skulderen, stopper du den øvelsen i dag.</strong><br><br>"
    + s.note;

  let h = "", i = 0;
  for (const [bt, list] of s.blocks) {
    const shown = list.filter(([, , , minWeek]) => !minWeek || w >= minWeek);
    let bs = 0;
    for (const [, , t] of shown) bs += Array.isArray(t) ? t[0] * t[1] + (t[0] - 1) * t[2] : t;
    h += "<section><h2>" + bt + "<em>" + mmss(bs) + "</em></h2>";
    for (const [nm, ds, t] of shown) {
      const id = "e" + (i++);
      const d = (ds || "").replace("__BAIL__", L.bail).replace("__KICK__", L.kick);
      const tag = Array.isArray(t) ? t[0] + " × " + t[1] + "s" : mmss(t);
      const inf = INFO[nm];
      h += '<div class="ex' + (st[id] ? " done" : "") + '" data-id="' + id + '">'
        + '<div class="bx">✓</div><div class="tx"><div class="nm">' + nm + "</div>"
        + (d ? '<div class="ds">' + d + "</div>" : "") + "</div>"
        + '<span class="tg">' + tag + "</span>"
        + (inf ? '<button class="inf" data-inf="' + id + '">ⓘ</button>' : "")
        + "</div>"
        + (inf ? '<div class="infbox" id="inf-' + id + '">' + linkify(inf) + "</div>" : "");
    }
    h += "</section>";
  }
  if (s.meas) {
    h += "<section><h2>Noter nå<em>før du lukker appen</em></h2><div class='meas'>";
    if (s.measNote) h += "<div class='measnote'>" + esc(s.measNote) + "</div>";
    for (const [k, lab, ph] of s.meas)
      h += "<label>" + lab + "<input data-m='" + k + "' placeholder=\""
        + String(ph || "").replace(/"/g, "&quot;") + "\" value=\""
        + String(st["m_" + k] || "").replace(/"/g, "&quot;") + "\"></label>";
    h += "</div></section>";
  }
  document.getElementById("main").innerHTML = h;
}

/* ---------- lyd ---------- */
let AC = null;
function unlockAudio() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    g.gain.value = 0.0001; o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + 0.01);
  } catch (e) {}
}
function beep(freq, ms, vol) {
  if (!AC) return;
  try {
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol == null ? 0.35 : vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + ms / 1000 + 0.02);
  } catch (e) {}
}
const buzz = p => { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} };
const cue = () => { beep(950, 110, .28); buzz(35); };                                  // 3-2-1
const toWork = () => { beep(1250, 150); setTimeout(() => beep(1250, 260), 180); buzz([90, 60, 160]); };
const toRest = () => { beep(560, 420); buzz(220); };
/* øvelse ferdig — fallende treklang, tydelig forskjellig fra arbeid og hvile */
const toReady = () => { [[880, 0], [660, 190], [440, 380]].forEach(([f, d]) => setTimeout(() => beep(f, 300), d)); buzz([200, 100, 200]); };
const endAll = () => { [0, 200, 400].forEach((d, i) => setTimeout(() => beep(700 + i * 250, 300), d)); buzz([120, 80, 120, 80, 260]); };

/* ---------- runner ---------- */
let steps = [], idx = 0, endsAt = 0, left = 0, paused = true, loop = null, lastCue = -1, wake = null;
/* ready = ny øvelse venter på at han trykker Start. Gir tid til å flytte seg og rigge */
let ready = false;
/* lead = nedtelling fra Start-trykket til første serie, så han rekker å komme i posisjon */
const LEAD = 5;
let lead = false;

/* oppsummering av en hel øvelse, f.eks. "5 × 30 sek · hvile 45 sek" */
function exSummary(i) {
  const mine = steps.filter(s => s.id === steps[i].id);
  const work = mine.filter(s => s.work), rest = mine.filter(s => !s.work);
  if (work.length === 1) return "varighet " + mmss(work[0].sec);
  return work.length + " × " + work[0].sec + " sek" + (rest.length ? " · hvile " + rest[0].sec + " sek" : "");
}

/* Skjermen holdes våken så lenge appen er synlig — også når økta står på pause.
   Pause betyr at noe avbrøt ham og at han kommer tilbake; da er skjermlås verst.
   Nettleseren slipper låsen selv når sida skjules, derfor lytter vi på release
   og ber om den på nytt hver gang sida blir synlig igjen. */
async function keepAwake(on) {
  try {
    if (on) {
      if (!wake && document.visibilityState === "visible" && "wakeLock" in navigator) {
        wake = await navigator.wakeLock.request("screen");
        wake.addEventListener("release", () => { wake = null; });
      }
    } else if (wake) { await wake.release(); wake = null; }
  } catch (e) { wake = null; }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake(true);
});
/* Enkelte nettlesere krever et brukertrykk før første forespørsel */
document.addEventListener("click", () => keepAwake(true), { once: true });

function startRun() {
  steps = buildSteps();
  if (!steps.length) return;
  idx = 0; paused = false;
  unlockAudio();
  const pb = document.getElementById("rPause");
  pb.textContent = "Pause"; pb.classList.remove("paused");
  document.getElementById("run").classList.add("on");
  keepAwake(true);
  enter();
  loop = setInterval(tick, 200);
}
function stopRun() {
  clearInterval(loop); loop = null; paused = true;
  /* skjermlåsen beholdes — appen er fortsatt åpen */
  document.getElementById("run").classList.remove("on");
  render();
}
function enter() {
  const s = steps[idx], prev = steps[idx - 1];
  left = s.sec; lastCue = -1; lead = false;

  /* Ny øvelse? Da venter vi på at han trykker Start.
     Innenfor en øvelse går seriene automatisk — han skal ikke måtte ta på
     telefonen mellom settene. Første steg i økta går rett til nedtellingen,
     fordi «Start økt» allerede var trykket. */
  const fresh = !prev || prev.id !== s.id;
  ready = fresh && !!prev;
  if (ready) { toReady(); paint(); return; }
  if (fresh) { beginLead(); return; }

  endsAt = Date.now() + s.sec * 1000;
  if (s.work) toWork(); else toRest();
  paint();
}
/* Start trykket: tell ned LEAD sek med 3-2-1, deretter starter første serie */
function beginLead() {
  ready = false; lead = true;
  left = LEAD; endsAt = Date.now() + LEAD * 1000; lastCue = -1;
  paint();
}
function tick() {
  if (paused || ready) return;
  left = Math.max(0, (endsAt - Date.now()) / 1000);
  const w = Math.ceil(left);
  if (w <= 3 && w >= 1 && w !== lastCue) { lastCue = w; cue(); }
  if (left <= 0 && lead) {
    const s = steps[idx];
    lead = false; left = s.sec; endsAt = Date.now() + s.sec * 1000; lastCue = -1;
    if (s.work) toWork(); else toRest();
    return paint();
  }
  if (left <= 0) return next(true);
  paint();
}
function next(auto) {
  if (idx >= steps.length - 1) {
    const st = load(); steps.forEach(s => st[s.id] = true); save(st);
    endAll(); stopRun(); toast("Økt fullført — trykk Logg");
    return;
  }
  const done = steps[idx];
  if (!steps.slice(idx + 1).some(s => s.id === done.id)) { const st = load(); st[done.id] = true; save(st); }
  idx++; enter();
}
function prev() { if (idx > 0) { idx--; enter(); } }

function paint() {
  const s = steps[idx], w = Math.ceil(left);
  document.getElementById("rCount").textContent = "steg " + (idx + 1) + " / " + steps.length;
  document.getElementById("rBlock").textContent = s.bt;
  document.getElementById("rName").textContent = s.nm;
  document.getElementById("rDesc").textContent = (ready || s.work) ? (s.ds || "") : "";

  const ph = document.getElementById("rPhase");
  const n = document.getElementById("rNum");
  const btn = document.getElementById("rPause");

  if (ready) {
    ph.textContent = "KLAR — RIGG DEG TIL";
    ph.className = "rphase ready";
    n.textContent = w >= 60 ? mmss(w) : w;
    n.className = "rnum idle";
    document.getElementById("rSet").textContent = exSummary(idx);
    btn.textContent = "▶ Start øvelsen";
    btn.classList.remove("paused");
  } else if (lead) {
    ph.textContent = "STARTER OM";
    ph.className = "rphase ready";
    n.textContent = w;
    n.className = "rnum" + (w <= 3 ? " warn" : "");
    document.getElementById("rSet").textContent = s.sets ? "serie " + s.set + " av " + s.sets : "";
    btn.textContent = paused ? "Fortsett" : "Pause";
    btn.classList.toggle("paused", paused);
  } else {
    ph.textContent = s.work ? "ARBEID" : "HVILE";
    ph.className = "rphase" + (s.work ? "" : " rest");
    n.textContent = w >= 60 ? mmss(w) : w;
    n.className = "rnum" + (w <= 3 ? " warn" : "");
    document.getElementById("rSet").textContent = s.sets ? "serie " + s.set + " av " + s.sets : "";
    btn.textContent = paused ? "Fortsett" : "Pause";
    btn.classList.toggle("paused", paused);
  }

  document.getElementById("rInfo").style.display = INFO[s.nm] ? "" : "none";

  const nx = steps[idx + 1];
  document.getElementById("rNext").textContent = nx ? "Neste: " + (nx.work ? nx.nm : "hvile " + nx.sec + " sek") : "Siste steg";
  document.getElementById("rBar").style.width = (ready ? 0 : 100 * (1 - left / (lead ? LEAD : s.sec))) + "%";
}

document.getElementById("rInfo").onclick = () => visInfo(steps[idx].nm);
document.getElementById("iClose").onclick = () => document.getElementById("info").classList.remove("on");

document.getElementById("start").onclick = startRun;
document.getElementById("rQuit").onclick = () => { if (confirm("Avslutte økta?")) stopRun(); };
document.getElementById("rPrev").onclick = prev;
document.getElementById("rNextBtn").onclick = () => next(false);
document.getElementById("rPause").onclick = () => {
  keepAwake(true);                       // aldri slipp låsen på pause
  if (ready) { beginLead(); return; }
  paused = !paused;
  if (paused) left = Math.max(0, (endsAt - Date.now()) / 1000);
  else endsAt = Date.now() + left * 1000;
  paint();
};

/* ---------- liste-interaksjon ---------- */
document.addEventListener("click", e => {
  const nav = e.target.closest("nav button");
  if (nav) { day = nav.dataset.d; render(); return; }
  const ib = e.target.closest("[data-inf]");           // må sjekkes før .ex, ellers krysses øvelsen av
  if (ib) { document.getElementById("inf-" + ib.dataset.inf).classList.toggle("on"); return; }
  const ex = e.target.closest(".ex");
  if (ex) {
    const st = load(); st[ex.dataset.id] = !st[ex.dataset.id]; save(st);
    ex.classList.toggle("done", !!st[ex.dataset.id]);
    if (st[ex.dataset.id]) buzz(12);
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset.m) { const st = load(); st["m_" + e.target.dataset.m] = e.target.value; save(st); }
});

function toast(m) {
  const t = document.getElementById("toast");
  t.textContent = m; t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 2400);
}

document.getElementById("copy").onclick = async () => {
  const st = load(), s = S[day], w = weekNo();
  let done = 0, tot = 0, lines = [], i = 0;
  for (const [bt, list] of s.blocks) {
    const hit = [];
    for (const [nm] of list) { const id = "e" + (i++); tot++; if (st[id]) { done++; hit.push(nm); } }
    if (hit.length) lines.push("- " + bt + ": " + hit.join(" · "));
  }
  const wd = new Date().toLocaleDateString("no-NO", { weekday: "long" });
  let txt = "/okt\n\n## " + iso(new Date()) + " — " + wd.charAt(0).toUpperCase() + wd.slice(1) + ", " + s.title + " (" + (s.logTag || "testuke høyre skulder") + ")\n"
    + lines.join("\n") + "\n- Gjennomført: " + done + " av " + tot + " øvelser\n";
  if (s.meas) {
    const m = s.meas
      .filter(([k]) => k !== "rpe")
      .map(([k, lab]) => st["m_" + k] ? "  - " + lab + ": " + st["m_" + k] : null)
      .filter(Boolean);
    if (m.length) txt += "- Måling:\n" + m.join("\n") + "\n";
  }
  txt += "- RPE: " + (st["m_rpe"] || "") + "\n- Form: \n- Notat: ";
  try { await navigator.clipboard.writeText(txt); toast("Kopiert — lim inn til Claude"); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Kopiert — lim inn til Claude"); } catch (e2) { toast("Kunne ikke kopiere"); }
    ta.remove();
  }
};
document.getElementById("reset").onclick = () => { if (confirm("Nullstille avkryssingen for i dag?")) { save({}); render(); } };

render();
keepAwake(true);        // skjermen holdes våken fra appen åpnes, ikke først når økta starter
</script>

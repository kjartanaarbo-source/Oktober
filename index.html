<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Blokk 2</title>
<style>
/* Fargetema fra v17: gult, grønt og oransje i samspill. Varm, myk bunn, ingen svarte rammer.
   Alle farger samlet her. Endres ett sted. */
:root{
  --bg:#fff8e6;          /* kremgul bunn */
  --card:#fffdf5;
  --ink:#3a2a12;         /* varm mørkebrun tekst */
  --soft:#7d6a4b;
  --line:#f1e2bf;
  --yellow:#ffcc33;  --yellow-soft:#fff0b3;
  --orange:#ff8c1a;  --orange-soft:#ffdcb8;
  --green:#6cc04a;   --green-soft:#dcf2cf;  --green-deep:#3f8f2c;
  --sun:linear-gradient(100deg,var(--yellow) 0%,var(--orange) 55%,var(--green) 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit}
.hl{color:var(--ink);background:var(--yellow);padding:1px 5px;border-radius:5px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.lnk{color:var(--green-deep);font-weight:700}

/* ---------- liste ---------- */
#list{padding-bottom:130px}
header{position:sticky;top:0;z-index:20;background:var(--bg);box-shadow:0 2px 10px #c9a24a22;padding:env(safe-area-inset-top) 0 0}
header::before{content:"";display:block;height:6px;background:var(--sun)}
.wk{padding:10px 16px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wk b{font-size:15px;color:var(--orange);letter-spacing:.02em;font-weight:800}
.wk span{font-size:12px;color:var(--soft)}
nav{display:flex;gap:6px;padding:0 12px 12px}
nav button{flex:1;padding:12px 4px;border:none;border-radius:14px;background:var(--yellow-soft);color:var(--ink);font:700 15px/1 inherit}
nav button.on{background:var(--orange);color:#fff;box-shadow:0 3px 0 #d96f05}
.banner{margin:12px;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,var(--yellow-soft),var(--orange-soft));color:var(--ink);font-size:14px;line-height:1.45}
.banner b{color:var(--orange);display:block;margin-bottom:4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
main{padding:0 12px}
section{margin-bottom:16px;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 12px #c9a24a26}
h2{margin:0;padding:13px 16px;font-size:15px;font-weight:800;background:var(--yellow);color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px}
/* blokkene veksler mellom gult, oransje og grønt */
section:nth-of-type(3n+2) h2{background:var(--orange);color:#fff}
section:nth-of-type(3n+3) h2{background:var(--green);color:#fff}
h2 em{font-style:normal;font-size:12px;font-weight:700;opacity:.85;white-space:nowrap}
.ex{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.ex:last-child{border-bottom:none}
.bx{flex:none;width:28px;height:28px;margin-top:1px;border-radius:50%;border:2.5px solid var(--yellow);display:grid;place-items:center;font-size:15px;font-weight:900;color:transparent;transition:.15s}
.ex.done .bx{background:var(--green);border-color:var(--green);color:#fff}
.ex.done .nm{color:#b3a17f;text-decoration:line-through}
.tx{flex:1;min-width:0}
.nm{font-size:15.5px;font-weight:700;line-height:1.35}
.ds{font-size:13.5px;color:var(--soft);margin-top:3px;line-height:1.45}
.tg{flex:none;align-self:center;padding:6px 10px;border-radius:10px;background:var(--orange-soft);color:var(--ink);font:700 12px/1 inherit;white-space:nowrap}
.inf{flex:none;align-self:center;width:34px;height:34px;border-radius:50%;border:none;background:var(--green-soft);color:var(--green-deep);font:800 15px/1 inherit}
.infbox{display:none;padding:12px 16px 16px;font-size:14.5px;line-height:1.62;color:var(--ink);white-space:pre-line;border-bottom:1px solid var(--line);background:#fff6d6}
.infbox.on{display:block}
.infbtn{margin-top:10px;padding:9px 14px;border-radius:12px;border:none;background:#ffffff55;color:inherit;font:800 13px/1 inherit}
#info{display:none;position:fixed;inset:0;z-index:55;background:var(--bg);padding:env(safe-area-inset-top) 0 0;flex-direction:column}
#info.on{display:flex}
#info::before{content:"";display:block;height:6px;flex:none;background:var(--sun)}
#info h3{margin:0;padding:18px 18px 4px;font-size:22px;font-weight:800;line-height:1.2}
#info .sub{padding:0 18px 12px;font-size:13px;color:var(--orange);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
#info .body{flex:1;overflow-y:auto;padding:0 18px 20px;font-size:15.5px;line-height:1.68;color:var(--ink);white-space:pre-line;-webkit-overflow-scrolling:touch}
#info .cls{margin:0 18px calc(16px + env(safe-area-inset-bottom));padding:16px;border-radius:14px;border:none;background:var(--green);color:#fff;font:800 15px/1 inherit;flex:none}
.meas{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.meas label{font-size:14px;color:var(--ink);font-weight:600;display:flex;flex-direction:column;gap:6px}
.meas input{padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);font:700 17px/1 inherit}
.meas input:focus{outline:none;border-color:var(--orange)}
.meas input::placeholder{color:#c4b28e;font-weight:500}
.measnote{font-size:13px;line-height:1.5;color:var(--ink);background:var(--green-soft);border-radius:12px;padding:10px 12px;margin-bottom:2px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff8e6ee;backdrop-filter:blur(10px);box-shadow:0 -2px 10px #c9a24a22;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.bar button{flex:1;padding:15px 8px;border-radius:14px;border:none;font:800 15px/1 inherit;background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-deep)}
.bar button.sec{background:var(--yellow-soft);color:var(--ink);box-shadow:none;flex:0 0 84px;font-weight:700}
.bar button.amber{background:var(--yellow);color:var(--ink)}

/* ---------- runner ---------- */
/* hele skjermen skifter farge med fasen, så den kan leses fra matta:
   oransje = arbeid · grønn = hvile · gul = klar / starter om */
#run{display:none;position:fixed;inset:0;z-index:40;background:var(--orange);color:var(--ink);flex-direction:column;padding:env(safe-area-inset-top) 16px calc(12px + env(safe-area-inset-bottom));transition:background .25s}
#run.on{display:flex}
#run[data-ph="rest"]{background:var(--green)}
#run[data-ph="ready"]{background:var(--yellow)}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0 4px;font-size:12px;opacity:.75;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.rtop button{background:none;border:none;color:inherit;font:800 13px/1 inherit;padding:8px 2px}
.rblock{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-top:6px;opacity:.75}
.rname{font-size:30px;font-weight:800;line-height:1.15;margin:6px 0 8px}
.rdesc{font-size:15px;line-height:1.5;opacity:.9}
.rmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0}
.rphase{font-size:15px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;padding:6px 16px;border-radius:12px;background:#fff8e6;color:var(--orange)}
.rphase.rest{color:var(--green-deep)}
.rphase.ready{color:var(--ink)}
.rnum{font-size:clamp(80px,28vw,140px);font-weight:800;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.rnum.idle{opacity:.35}
.rnum.warn{color:#fff}
#run[data-ph="ready"] .rnum.warn{color:var(--orange)}
.rset{font-size:15px;font-weight:800;opacity:.85}
.rnext{font-size:13.5px;text-align:center;padding:8px 0 4px;min-height:22px;opacity:.8}
.rprog{height:8px;border-radius:999px;background:#3a2a1222;overflow:hidden;margin:8px 0 12px}
.rprog i{display:block;height:100%;background:#fff8e6;width:0;transition:width .3s}
#run[data-ph="ready"] .rprog i{background:var(--orange)}
.rctl{display:flex;gap:8px}
.rctl button{flex:1;padding:17px 6px;border-radius:14px;border:none;background:#ffffff40;color:inherit;font:800 15px/1 inherit}
.rctl button.main{background:#fff8e6;color:var(--ink);flex:1.5}
.rctl button.main.paused{background:var(--yellow);color:var(--ink)}
#run[data-ph="ready"] .rctl button.main{background:var(--green);color:#fff}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(14px);background:var(--green);color:#fff;padding:12px 22px;border-radius:14px;font:800 14px/1 inherit;opacity:0;transition:.22s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="list">
  <header>
    <div class="wk"><b id="wkLabel">—</b><span id="dateLabel">—</span></div>
    <nav>
      <button data-d="man">Man</button>
      <button data-d="ons">Ons</button>
      <button data-d="tor">Tor</button>
      <button data-d="helg">Helg</button>
      <button data-d="lor">Måling</button>
    </nav>
  </header>
  <div class="banner" id="banner"></div>
  <main id="main"></main>
  <div class="bar">
    <button class="sec" id="reset">Nullstill</button>
    <button class="sec" id="copy">Logg</button>
    <button id="start">▶ Start økt</button>
  </div>
</div>

<div id="run">
  <div class="rtop">
    <span id="rCount">—</span>
    <button id="rQuit">Avslutt ✕</button>
  </div>
  <div>
    <div class="rblock" id="rBlock">—</div>
    <div class="rname" id="rName">—</div>
    <div class="rdesc" id="rDesc"></div>
    <button class="infbtn" id="rInfo">ⓘ&nbsp; Teknikk</button>
  </div>
  <div class="rmid">
    <div class="rphase" id="rPhase">ARBEID</div>
    <div class="rnum" id="rNum">0</div>
    <div class="rset" id="rSet"></div>
  </div>
  <div class="rnext" id="rNext"></div>
  <div class="rprog"><i id="rBar"></i></div>
  <div class="rctl">
    <button id="rPrev">◀ Forrige</button>
    <button class="main" id="rPause">Pause</button>
    <button id="rNextBtn">Neste ▶</button>
  </div>
</div>

<div id="info">
  <h3 id="iTitle">—</h3>
  <div class="sub">Teknikk</div>
  <div class="body" id="iBody"></div>
  <button class="cls" id="iClose">Lukk</button>
</div>

<div id="toast"></div>

<script>
"use strict";

/* ======= blokk 2: 2026-11-02 → 2026-12-13 ======= */
const VERSION = "v19";          // vises i toppen — så du ser om telefonen kjører gammel bufret versjon
const BLOCK_START = new Date(2026, 10, 2);   // 2026-11-02 (måned teller fra 0)
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

function weekNo() {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.min(Math.max(Math.floor((t - BLOCK_START) / 6048e5) + 1, 1), 6);
}
/* bailen ligger alltid ett steg foran oppsparket */
function ladder(w) {
  if (w <= 2) return { bail: "Vegg, frontsplitt, vekt ut. Mot slutten av uke 2: prøv 60–80 cm", kick: "Vegg 30–40 cm bak deg" };
  if (w <= 4) return { bail: "60–80 cm. Mot slutten av uke 4: åpent gulv", kick: "Vegg 60–80 cm bak deg" };
  return { bail: "Åpent gulv, fra fritt oppspark", kick: "Åpent gulv" };
}

/* øvelse: [navn, beskrivelse, tid, fraUke?, tilUke?]
   tid = sekunder  ELLER  [serier, arbeid, hvile] */
const REGLER = "<strong class='hl'>Stopp-regel: kjenning foran og øverst på høyre skulder — stopp den øvelsen i dag.</strong><br><br>"
  + "To dårlige forsøk eller sett på rad: avslutt øvelsen. Dosene er tak, ikke «opptil».";
const KICK = ["Free kick-up to handstand", "1 × 5, åpent gulv. Pust ut i sparket. Noter treff og hvilken side bailen gikk til", 180];
const HOFTE_HELG = [
  ["Elevated hamstring stretch", "Bøyd kne → strakt, brystet mot låret. 5 dynamiske + 30 sek hold. Annenhver side: H, V, H, V", [4, 60, 10]],
  ["Half split", "Fra bøyd kne, brystet mot fremre lår. 5 dynamiske + 30 sek hold. Annenhver side", [4, 60, 10]],
  ["Couch stretch", "Bekkenet tippet bakover, setet stramt. Reis deg bare så langt tippen holder. Annenhver side", [4, 60, 10]]
];
const S = {
  man: {
    title: "Håndstand og styrke",
    banner: "<b>Mandag — heel pulls og styrke</b>"
      + "20 min håndstand, så trekk før press. Noter reps per sett og reps igjen på siste sett.<br><br>" + REGLER,
    blocks: [
      ["Oppvarming", [
        ["Wrist circles", "Trepunktskontakt, mest last på puten der fingrene starter. 8 sirkler hver vei", 120],
        ["Scapula push-ups", "10 reps. Strake albuer, bare skulderbladene beveger seg", [2, 30, 15]],
        ["Band pull-aparts", "15 reps. Skuldrene ned, kontrollert tilbake", [2, 30, 15]],
        ["Inchworm", "Krum ryggen FØR føttene går inn. 4 reps per sett", [2, 45, 15]]
      ]],
      ["1 · Håndstand — 20 min", [
        KICK,
        ["Handstand heel pulls", "Ryggen mot veggen, håndrot 15–20 cm fra den (mål!). 3 heel pulls per sett, maks 30 sek på hendene. Stopp ved to dårlige sett på rad", [8, 30, 60]]
      ]],
      ["2 · Styrke", [
        ["Strict pull-up", "6 × 2. Aldri til failure. Noter reps igjen på siste sett", [6, 20, 90]],
        ["Ring support hold", "UKE 3: oppvarming før ring dip-testen. Strake armer, ringene vridd ut", [2, 20, 40], 3, 3],
        ["Ring dip", "UKE 3: ETT sett, maks strenge reps. Full lockout, ingen kipping. Stopp når en rep ikke er ren", 60, 3, 3],
        ["Dips", "3 × 3. 3 sek ned, full lockout. Fast stativ", [3, 30, 120]],
        ["Pike push-up", "UKE 1: 2 × 8. Siste sett minst 2 reps igjen", [2, 40, 60], 1, 1],
        ["Strict HSPU", "4 × 3 på 10 cm (10 kg skive + abmat). 1 rep igjen per sett. Hodet MÅ berøre abmatten — ellers er settet over", [4, 30, 90], 2]
      ]]
    ],
    measNote: "Skriv rått. Heel pulls: per sett, hvor mange av 3 som fikk hælene fra veggen, og beste hold. Styrke: reps per sett, og hvor mange du hadde igjen på siste sett.",
    meas: [
      ["skulder", "Høyre skulder i morges — noe foran og øverst? I ro?", "ingenting"],
      ["kick", "Oppspark 1 × 5 — kom ikke opp / stabilt / over · bailside", "1 / 2 / 2 · V, V"],
      ["avstand", "Heel pulls — avstand håndrot–vegg (cm)", "18"],
      ["heel", "Heel pulls — per sett: fikk hælene fra veggen / beste hold", "2/3 3s · 1/3 2s · …"],
      ["pull", "Strict pull-up — reps per sett · igjen på siste", "2,2,2,2,2,2 · 2 igjen"],
      ["dips", "Dips (og ring dip i uke 3) — reps per sett · igjen på siste", "3,3,3 · 2 igjen"],
      ["press", "Pike push-up / HSPU — reps per sett · igjen · cm", "3,3,3,3 · 1 igjen · 10 cm"],
      ["rpe", "RPE for økta (1–10)", "7"],
      ["smerte", "Smerte under økta — hvilken øvelse?", "ingen"]
    ]
  },
  ons: {
    title: "Håndstand, linje og kompresjon",
    banner: "<b>Onsdag — block-squeeze, linje og kompresjon</b>"
      + "20 min håndstand, så linjen liggende og kompresjon. Kvalitet foran mengde.<br><br>" + REGLER,
    blocks: [
      ["Oppvarming", [
        ["Wrist circles", "Trepunktskontakt, mest last på puten der fingrene starter. 8 sirkler hver vei", 120],
        ["Thoracic extension over foam roller", "Setet i gulvet, ribbeina ned. 3 reps per plassering, to runder opp ryggen", 120],
        ["Inchworm", "Krum ryggen FØR føttene går inn. 4 reps per sett", [2, 45, 15]],
        ["Bunny hops", "Hoftene OPP over skuldrene, land mellom hendene. Bortover rommet", [2, 40, 30]]
      ]],
      ["1 · Håndstand — 20 min", [
        KICK,
        ["Block-squeeze kick-up to handstand", "3 forsøk per sett, annenhver side: blokk V, H, V, H … Ryggen mot veggen, mål avstanden. Teller: blokka på plass til du står i linje", [6, 75, 45]]
      ]],
      ["2 · Linje", [
        ["Prone body line hold on blocks", "Magen ned, blokk over knærne og under albuene, armene strake over hodet. Ribbeina inn", [3, 15, 45]],
        ["Hollow rock", "10 reps. Ryker formen: gå til hollow hold", [2, 30, 30]],
        ["Hollow hold", "Korsryggen i gulvet. Senk beina bare så langt den blir liggende", [3, 25, 35]],
        ["Star side plank", "20 sek, annenhver side: H, V, H, V, H, V. Går ikke stjerna: vanlig side plank på strak arm", [6, 20, 20]]
      ]],
      ["3 · Kompresjon og aktiv hofte", [
        ["Advanced tuck", "Paralletter. Strake armer, rett rygg, lårene vannrett. 10 sek", [3, 10, 50]],
        ["Seated pike leg lifts", "8 reps. Strake knær, ikke len deg bakover", [3, 40, 40]],
        ["Seated straddle leg lifts", "8 reps. Ett bein om gangen hvis begge ikke går", [3, 40, 40]]
      ]]
    ],
    measNote: "Skriv rått. Block-squeeze: per sett, side og hvor mange av 3 der blokka ble sittende til du sto i linje.",
    meas: [
      ["skulder", "Høyre skulder i morges — noe foran og øverst? I ro?", "ingenting"],
      ["kick", "Oppspark 1 × 5 — kom ikke opp / stabilt / over · bailside", "1 / 2 / 2 · V, V"],
      ["avstand", "Block-squeeze — avstand håndrot–vegg (cm)", "30"],
      ["block", "Block-squeeze — per sett: side, blokka på plass av 3", "V 2/3 · H 1/3 · …"],
      ["prone", "Prone hold — klarte du 15 sek? Kjentes korsryggen?", "ja / nei"],
      ["lifts", "Leg lifts — pike og straddle: variant og høyde", "pike begge 3 cm · straddle ett om gangen"],
      ["rpe", "RPE for økta (1–10)", "6"],
      ["smerte", "Smerte under økta — hvilken øvelse?", "ingen"]
    ]
  },
  tor: {
    title: "Float forward og hofte",
    banner: "<b>Torsdag — float forward og hofte</b>"
      + "Alt i tuck, med bøyde knær. Målet er hofta over hendene, ikke strake bein. Slow kick-up er på pause (2026-11-06).<br><br>" + REGLER
      + "<br><br>Strekk på ca. 7 av 10, i muskelen, aldri i ledd. Prikking eller nervedrag bak kneet: stopp øvelsen.",
    blocks: [
      ["Oppvarming", [
        ["Wrist circles", "Trepunktskontakt, mest last på puten der fingrene starter. 8 sirkler hver vei", 120],
        ["Inchworm", "Krum ryggen FØR føttene går inn. 4 reps per sett", [2, 45, 15]],
        ["Hip hinge with dowel", "8 reps, 3 sek ned. Bakhode, skulderblad, korsbein mot skaftet. Varmer baksiden før float forward", [2, 40, 20]],
        ["Standing pike pulses", "10 rolige pulser. Brystet mot lårene, rett knærne gradvis. Inn og ut av strekket, ikke hold", [2, 40, 20]]
      ]],
      ["1 · Håndstand — 20 min", [
        KICK,
        ["Tuck handstand negative", "Mot vegg, fingrene mot veggen. Tuck med hofta over hendene, senk på 3–5 sek til føttene står mellom hendene. Høyre skulder: stopp", [4, 20, 60]],
        ["Bunny hops", "Myke. Hoftene OPP over hendene, land stille mellom hendene", [3, 30, 45]],
        ["Float forward from block", "Blokk på laveste side, hendene 30 cm foran. Bøy knærne til hendene står flatt. Vekten fram til tærne nesten slipper, flyt ned mellom hendene", [8, 15, 30]],
        ["Float forward from downward dog", "MÅLING, 2 forsøk. Film fra siden. Hofta over hendene? Hvor landet føttene? Dunk?", [2, 15, 45]]
      ]],
      ["2 · Hofte — 25 min", [].concat(HOFTE_HELG).concat([
        ["Elevated pancake", "På 5–15 cm forhøyning, bøyde knær. 3 runder contract–relax (press hælene ned 5 sek, slipp, pust ut, gå lenger) + 30 sek hold", [2, 90, 20]],
        ["Wall straddle stretch", "Ligg på ryggen, beina opp veggen i straddle. Hendene som motstand: 3 runder contract–relax + hold", [2, 90, 20]]
      ])]
    ],
    measNote: "Skriv rått. Ikke RPE i dag. Float forward: var hofta over hendene før føttene slapp, hvor landet føttene (utenfor / mellom hendene), og dunket det.",
    meas: [
      ["skulder", "Høyre skulder i morges — noe foran og øverst? I ro?", "ingenting"],
      ["kick", "Oppspark 1 × 5 — kom ikke opp / stabilt / over · bailside", "1 / 2 / 2 · V, V"],
      ["neg", "Tuck negative — kontrollert ned av 4 · avstand hender–vegg", "3 / 4 · 25 cm"],
      ["block", "Float from block — hofta over hendene / lydløs, av 8", "5 / 8 · 2 / 8"],
      ["float", "Float forward fra downward dog, 2 forsøk — hofte over hendene? utenfor / mellom · dunk?", "ja, mellom, dunk · nei, utenfor"],

"Wall lean-away hold":
"OPPSETT: bryst-mot-vegg med hendene så nær veggen at kroppen står nesten loddrett. Det er avstanden fra hendene til veggen som bestemmer hvor nær balansepunktet du er — ikke en bevegelse du gjør etterpå.\n\nUTFØRELSE: press fingrene ned til tærne nesten ikke har vekt mot veggen. Ingenting skal bevege seg synlig — det som flytter seg, er trykket, fra tærne over i fingrene. Hold der i 5 sekunder. Sitter det, løft tærne én centimeter.\n\nHvorfor ikke «len deg bort»: en stiv kropp kan ikke lene seg bort fra veggen. Med hender og tær i ro kan den bare rotere rundt håndleddene, og da slipper tærne med en gang. Tyngdepunktet flyttes ut bare på tre måter: bøy i hofta (feil — ødelegger linjen), splitt beina (det er toe pulls), eller hendene nærmere veggen (det er oppsettet her).\n\nHofta er låst hele veien. Ribbein ned, sete strammet, bakover-tilt. Kjenner du at du knekker i hofta eller bøyer albuene for å holde deg, er settet over.\n\nRetningen bort fra veggen er overbalanse. Veggen tar deg ikke der — det gjør cartwheel bail.\n\nForskjell fra toe pulls: der flyttes tyngdepunktet med beinet. Her står tyngdepunktet stille, og vekta flyttes over i fingrene.\n\nFormål: akkumulere tid i selve balansepunktet. Du holder 3 × 30 sekunder mot vegg uten problem, så skulderutholdenheten er på plass — det du mangler er tid der balansen faktisk utfordres.",

"Dowel pancake test":

"Wrist circles":
"FORMÅL: varme opp håndleddene og øve inn trykkfordelingen du skal bruke i håndstand.\n\nSTARTSTILLING: på alle fire, eller i planke hvis det kjennes lett. Hendene rett under skuldrene, fingrene spredt og langfingeren pekende rett fram.\n\nArmene strake. Skyv gulvet bort så skulderbladene glir fra hverandre og ryggen mellom dem ikke synker ned. Ribbeina inn, magen stram. Det er dette som er «hele kroppen aktiv»: kroppen er stiv, og det er bare skuldrene som flytter vekten.\n\nTREPUNKTSKONTAKTEN: tre punkter i gulvet hele tiden — håndroten, puten der fingrene starter og fingertuppene.\n\nMEST LAST PÅ PUTEN DER FINGRENE STARTER. Fingertuppene griper lett i gulvet, som om du prøver å klemme gulvet sammen under hånda, uten at knokene løfter seg.\n\nBEVEGELSEN: flytt hele kroppen i en langsom sirkel over hendene: fram, til siden, bakover og til den andre siden. Det er skuldrene som sirkler. Hendene står helt stille.\n\nNår du flytter vekten fram, øker trykket på puten og fingertuppene. Når du flytter den bakover, øker trykket i håndroten. Ingen av de tre punktene skal løfte seg på noe tidspunkt.\n\n8 sirkler hver vei. Avslutt med 10 sek der du står med vekten litt fram og kjenner at fingrene jobber.\n\nDET DU SKAL KJENNE: at trykket vandrer rundt i hånda mens kontakten med gulvet holder seg. Det er den samme korreksjonen du skal bruke i heel pulls.\n\nFEIL Å SE ETTER: fingrene løfter seg når vekten går bakover, eller skuldrene synker mellom skulderbladene.",

"Thoracic extension over foam roller":
"FORMÅL: bevegelighet i brystryggen, den stive delen fysioen fant. Får brystryggen gi etter, trenger ikke korsryggen å svaie for å få armene over hodet i håndstand.\n\nSTARTSTILLING: ligg på ryggen med skumrulla på tvers under ryggen, omtrent nederst på skulderbladene. Knærne bøyd, føttene i gulvet, SETET I GULVET. Hendene bak hodet, albuene pekende fram, så hendene bærer hodet og nakken ikke henger. Ribbeina ned, magen stram.\n\nBEVEGELSEN: pust ut og len overkroppen bakover over rulla så langt det er komfortabelt. Rulla er et dreiepunkt, og brystryggen bøyer seg bakover rundt den. Hold 2–3 sek, og kom tilbake opp.\n\n3 repetisjoner, så flytter du rulla noen centimeter opp. Start nederst på skulderbladene, avslutt øverst på dem. Gå to runder opp.\n\nHVA STÅR STILLE: setet ligger i gulvet, og ribbeina holdes nede. Det er de to tingene som låser korsryggen, slik at bøyningen må skje i brystryggen.\n\nDET DU SKAL KJENNE: trykk og strekk i øvre del av ryggen, rundt skulderbladene.\n\nFEIL Å SE ETTER: setet løfter seg, eller ribbeina spretter opp. Da svaier korsryggen og tar bevegelsen, og det er akkurat det vi vil unngå. Rulla ligger under korsryggen eller nakken. Den skal ligge mellom nederst og øverst på skulderbladene.",

"Inchworm":
"MED KRUM RYGG — varianten fra håndstandkurset.\n\nFORMÅL: øve inn formen fra pressen: øvre rygg krum, skulderbladene skjøvet fram og hoftene løftet bak deg. Det er motsatt av svaien du har i korsryggen.\n\nSTARTSTILLING: stå med føttene i hoftebredde. Bøy deg fram og sett hendene i gulvet foran føttene. Bøy knærne så mye som trengs.\n\nFØRSTE DEL, UT TIL PLANKE: gå med hendene fram til du står i planke: skuldrene over hendene, armene strake, kroppen rett fra skuldre til hæler. Skyv gulvet bort, ribbeina inn og setet stramt. Hold 2 sek.\n\nANDRE DEL, SAMMEN IGJEN — her ligger fokuset:\n\n1. Krum ryggen før beina beveger seg. Skyv gulvet hardere bort så skulderbladene glir fra hverandre og øvre rygg runder seg opp mot taket. Tipp bekkenet bakover, som i Posterior pelvic tilt, wall, så korsryggen også runder seg. Hoftene løfter seg litt.\n\n2. Gå med føttene inn mot hendene i korte skritt, og hold ryggen krum hele veien. Hoftene stiger mens føttene nærmer seg, og kroppen folder seg sammen som en pike. Hendene står stille.\n\n3. Gå så langt inn som du kommer med krum rygg og strake armer. Reis deg opp, og start neste repetisjon.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: hendene står stille hele tiden. Føttene vandrer, og hoftene stiger. Skuldrene holder seg over hendene eller litt foran dem.\n\nDET DU SKAL KJENNE: at magemusklene og musklene mellom skulderbladene og brystet jobber for å holde krummingen, og at bakside lår strekkes når føttene kommer nær.\n\nFEIL Å SE ETTER: ryggen flater ut eller svaier når føttene går inn. Da er krummingen sluppet — ta kortere skritt. Skuldrene glir langt fram foran hendene. Det belaster fremsiden av skulderen. DENNE UKA: hold skuldrene omtrent over hendene.",

"Bunny hops":
"VIDEO: https://youtube.com/shorts/VZH8Yvt5UgE\n\nOnsdag i oppvarmingen, torsdag som drill: 3 × 5, myke. Videoens drill 2.\n\nFORMÅL: vektoverføringen fra Float forward from downward dog: hoftene over skuldrene og vekten over i hendene, bare med fart. Hoppene er første trinn. Etter hvert blir hoppet mindre og tiden på hendene lengre, til du flyter fram uten hopp.\n\nSTARTSTILLING: nær Downward dog, men med føttene gått så langt inn at skuldrene står over håndleddene, som i startstillingen for oppsparket. Hoftene høyt, armene strake. Trepunktskontakt i hendene, mest last på puten der fingrene starter. Blikket i gulvet mellom hendene.\n\nBEVEGELSEN:\n\n1. Bøy knærne litt, og hopp med begge bein samtidig. Hoftene skal OPP, ikke fram. Målet er at hoftene kommer over skuldrene i luften.\n\n2. I luften trekker du knærne inn mot brystet, som i en tuck. Et øyeblikk bærer hendene hele vekten.\n\n3. Land mykt på føttene, MELLOM HENDENE.\n\n4. Gå med hendene fram til startstillingen, og gjenta. Slik kommer du deg bortover rommet.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: hendene står stille mens du hopper. Armene er strake hele tiden. Det er hoftene som flytter seg opp og over hendene.\n\nDET DU SKAL KJENNE: at vekten går over i hendene og at fingrene tar imot. Landingen skal være stille.\n\nFEIL Å SE ETTER: du hopper fram og ikke opp — da lander føttene foran der de var, men hoftene har aldri vært over hendene. Albuene bøyer seg i hoppet. Hard landing betyr at du falt ned fra hoppet i stedet for å kontrollere det.",

"Free kick-up to handstand":
"BLOKK 2: 1 × 5 helt først i alle tre egenøktene. Vedlikehold av porten fra blokk 1, ikke trening for å bli bedre. Fem forsøk, så er det gjort.\n\nOPPSETT: åpent gulv, ingen vegg. Matte der du lander i bailen er valgfritt. Uthvilt, rett etter oppvarmingen.\n\nSTARTSTILLING (fra 2026-10-01): gå med føttene inn til skuldrene står over håndleddene, armene loddrette og hoftene høyt. Trepunktskontakt, mest last på puten der fingrene starter. Starten står stille. Ingen bevegelse bakover og ingen sving. Et forsøk med sving teller ikke.\n\nBEVEGELSEN: pust ut når du sparker opp. Utpusten trekker ribbeina ned og strammer magen, så kroppen er stiv når du kommer opp.\n\nHøyre bein svinger strakt opp. Venstre bein sparker fra gulvet. Hoftene løftes OVER skuldrene, ikke fram. Spark til vertikal. Ikke stopp med vilje på halvveien.\n\nKommer du opp: korriger med fingrene. Går du over: Cartwheel bail, til den siden som kommer naturlig. Kommer du ikke opp: gå rolig ned igjen.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: hendene og skuldrene står stille. Det er beina som flytter tyngdepunktet opp over hendene.\n\nTELL HVERT FORSØK: kom ikke helt opp / stabilt punkt / over (bail). Skriv for eksempel «1 / 2 / 2», og hvilken side bailene gikk til. 2026-10-08 gikk nesten alle til høyre, 2026-10-29 gikk begge til venstre.\n\nSTOPP-REGLER: to dårlige forsøk på rad (overspark, bail før overbalanse, eller fingrene jobber ikke): stopp der. Kjenning foran og øverst på høyre skulder: stopp øvelsen for dagen.",

"Handstand heel pulls":
"MANDAGENS HOVEDØVELSE I BLOKK 2.\n\nFORMÅL: lære å bli stående ved å korrigere med fingrene. Veggen tar imot det du ikke redder, så du trenger ingen bail og har ingenting å frykte. Det er også første trinn mot Slow kick-up, der hælen så vidt skal berøre veggen.\n\nOPPSETT: håndroten ca. 15–20 cm fra veggen. Med ryggen mot veggen peker fingrene bort fra den, så håndroten er det punktet på hånda som er nærmest. Jo nærmere veggen, jo mer loddrett står du, og jo mindre skal til før du faller ut i rommet. 2026-10-29 sto du for nært og falt ofte ut. MÅL AVSTANDEN HVER GANG, OG HOLD DEN FAST til øvelsen sitter. Noter den.\n\nOPPSPARK: ryggen mot veggen. Spark opp, pust ut, og la hælene legge seg lett mot veggen. Still deg opp i linje: ribbeina ned, bekkenet tippet bakover, setet stramt og beina samlet. Hele kroppen stiv. Trepunktskontakt, mest last på puten der fingrene starter.\n\nÉN HEEL PULL:\n\n1. Press fingrene ned i gulvet. Trykket flyttes fram i hånda, og hele den stive kroppen vipper litt bort fra veggen. Hælene slipper.\n\n2. Hold balansen så lenge du klarer, og korriger med fingrene. Trykk mer med fingertuppene hvis du er på vei tilbake mot veggen. Slipp litt på fingrene, så trykket går mot håndroten, hvis du er på vei bort fra veggen.\n\n3. Når balansen ryker mot veggen, tar veggen imot. Det er hele poenget. Ryker den bort fra veggen, går du rolig ned.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: kroppen er stiv fra hender til tær og vipper som én enhet rundt håndleddene. Det er trykket i hendene som flytter seg. Hoftene skal IKKE bøye seg.\n\nDOSE: ett sett = spark opp, så 3 heel pulls med hælene tilbake til veggen mellom hver, så ned. Maks 30 sek på hendene per sett. Hvile 60 sek. Klokka gir 8 sett.\n\nNOTER PER SETT: hvor mange av de 3 som fikk hælene fra veggen, og beste hold i sekunder. For eksempel «2/3, 3 sek». Beste hold så langt: 2 sek (2026-10-29).\n\nNÅR SITTER DEN? Kriteriet settes etter de to første mandagene i blokk 2 (2026-11-02 og 2026-11-09), når vi har tall med riktig avstand.\n\nFEIL Å SE ETTER: du bøyer i hofta for å få føttene fra veggen. Da slipper beina, men hoftene lener seg bakover mot veggen, og det er ingen balanse. Det er den vanligste juksefeilen. Hele kroppen skal bort fra veggen, ikke bare føttene. Korsryggen svaier og magen henger. Albuene bøyer seg for å redde balansen.\n\nSTOPP-REGLER: to dårlige sett på rad, der ingen av heel pullene får hælene fra veggen eller formen ryker: stopp øvelsen. Kjenning foran og øverst på høyre skulder: stopp øvelsen for dagen.",

"Hip hinge with dowel":
"VIDEO: https://youtu.be/45DQiwq4oKk\nVIDEO: https://youtu.be/t4ouk4TmrS8\n\nFORMÅL: lære å bøye i hofta mens ryggen står helt stille. Det er grunnferdigheten under alle hofteøvelsene som kommer etter. Korsryggen din tar over så lett at du trenger et redskap som sier fra når den gjør det.\n\nSTARTSTILLING: stå med føttene i hoftebredde og knærne myke, litt bøyd. Knevinkelen holdes lik hele veien. Kosteskaftet langs ryggen. Den ene hånda holder det bak nakken, den andre bak korsryggen.\n\nTRE KONTAKTPUNKTER: bakhodet, mellom skulderbladene og korsbeinet. Det skal være en liten åpning ved korsryggen, omtrent en håndflate. Det er den naturlige svaien.\n\nBEVEGELSEN:\n\n1. Skyv hoftene bakover, som om du skal lukke en bildør med rumpa. Overkroppen tipper fram som en planke rundt hofteleddet.\n\n2. Gå ned langsomt, ca. 3 sek, til du kjenner strekk i bakside lår på ca. 7 / 10, eller til et av kontaktpunktene slipper skaftet. Det som kommer først, avgjør.\n\n3. Kom opp ved å skyve hoftene fram.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: bare hofteleddet beveger seg. Ryggen, nakken og knærne står stille. Skaftet viser det: alle tre punktene ligger inntil hele veien, og åpningen ved korsryggen er like stor.\n\nDET DU SKAL KJENNE: strekk i bakside lår, ikke i ryggen.\n\nFEIL Å SE ETTER: korsbeinet slipper skaftet — korsryggen runder seg, og det er nettopp det vi trener bort. Du har gått for langt, snu før det skjer. Åpningen ved korsryggen blir større — du svaier for å komme lenger ned. Bakhodet slipper — nakken bøyer seg. Hold blikket i gulvet ca. 1 m foran deg. Knærne bøyes mer for å komme lenger ned — da blir det en knebøy og ikke en hip hinge.",

"Elevated hamstring stretch":
"BØYD KNE → STRAKT, BRYSTET MOT LÅRET.\n\nFORMÅL: strekke bakside lår med ryggen ute av bevegelsen. Dette er fysioens øvelse slått sammen med varianten som ga deg gjennombruddet i foroverbøyen. Én side om gangen. Det er også fremre bein i frontsplitt.\n\nSTARTSTILLING: den ene foten på en boks, ca. knehøyde eller litt lavere. Foten avslappet, ikke trukket mot deg. Ståbeinet med tærne rett fram og kneet rett, men ikke låst. Hoftene i vater og rett fram. Hofta på boks-siden vil gjerne løfte seg og vri seg utover. Hold den nede.\n\nBEVEGELSEN:\n\n1. Bøy kneet på boksbeinet godt, og fold deg fram fra hofta til brystet ligger mot låret. Hendene på boksen eller på leggen.\n\n2. Pust inn. Hold brystet mot låret, pust ut og strekk kneet langsomt mot rett til du kjenner strekk på ca. 7 / 10.\n\n3. Hold 2–3 sek, og bøy kneet igjen.\n\n4. Gjenta, og gå litt lenger for hver gang: inn og ut av strekket.\n\n5. Den femte repetisjonen holdes i 30 sek. Pust rolig, og gå litt dypere på hver utpust.\n\nDOSE: 2 sett per side, annenhver side. Klokka gir 4 × 60 sek.\n\nPUSTEN: inn når kneet er bøyd, ut når du går inn i strekket. Utpusten får musklene til å slippe. Holder du pusten, strammer kroppen seg og holder igjen.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: brystet og låret er låst sammen, så ryggen kan ikke runde seg mer. Det eneste som beveger seg, er kneet. Når det strekkes, må bakside lår gi etter.\n\nDET DU SKAL KJENNE: strekk i bakside lår, fra setet og ned mot knehasen.\n\nFEIL Å SE ETTER: brystet slipper låret når du strekker kneet — da tar ryggen over. Stopp kneet der brystet fortsatt ligger inntil. Det er grensen din. Hofta på boks-siden løfter seg eller vrir seg utover. Du holder pusten i holdet. Prikking eller nervedrag bak kneet eller ned i leggen: stopp øvelsen. Det er nerven, ikke muskelen.",

"Half split":
"FRA BØYD KNE, BRYSTET MOT FREMRE LÅR.\n\nFORMÅL: samme strekk som Elevated hamstring stretch, men i stillingen fra frontsplitten. Det er denne stillingen ståbeinet ditt er i når du sparker opp: hofta bøyd og kneet strakt. Trenes på begge sider, siden du også vil lære oppspark med venstre bein.\n\nSTARTSTILLING: knestående på bakre kne, med en pute eller matte under. Fremre fot foran deg med hælen i gulvet. To yogablokker, én på hver side av fremre fot, for hendene. Hoftene rett fram, som frontlykter som peker framover. Bakre hofte vil gjerne vri seg utover.\n\nBEVEGELSEN:\n\n1. Fremre kne godt bøyd. Fold deg fram fra hofta til brystet ligger mot fremre lår, med hendene på blokkene.\n\n2. Pust inn. Hold brystet mot låret, pust ut, og skyv hoftene bakover mot bakre kne, så fremre kne strekker seg mot rett. Stopp på ca. 7 / 10.\n\n3. Hold 2–3 sek, og kom tilbake.\n\n4. 5 dynamiske repetisjoner. Den femte holdes i 30 sek, med rolig pust og litt dypere på hver utpust.\n\nDOSE: 2 sett per side, annenhver side. Klokka gir 4 × 60 sek.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: brystet og låret er låst sammen. Hoftene glir bakover, og fremre kne strekker seg. Ryggen står stille.\n\nDET DU SKAL KJENNE: strekk i bakside av fremre lår.\n\nFEIL Å SE ETTER: brystet slipper låret — ryggen tar over. Bakre hofte vrir seg utover, så bekkenet peker skrått. Du holder pusten. Prikking eller nervedrag bak kneet: stopp.",

"Couch stretch":
"BEKKENET TIPPET BAKOVER.\n\nFORMÅL: strekke hoftebøyerne foran på bakre bein i frontsplitten. Det er sparkbeinets side når du sparker opp. Mangler denne, gir korsryggen etter, og du får den kjente svaien. Øvelsen trener også det samme grepet som i håndstand: å tippe bekkenet bakover mens hofta strekkes.\n\nSTARTSTILLING: bakre kne i gulvet inntil en vegg eller en boks, med leggen opp langs veggen og tærne pekende opp. Pute under kneet. Fremre fot i gulvet foran deg, som i et utfall, med kneet over ankelen. Start med overkroppen lent fram og hendene på fremre kne eller på en blokk. Kjennes det for hardt: flytt bakre kne litt bort fra veggen.\n\nBEVEGELSEN:\n\n1. Tipp bekkenet bakover, som i Posterior pelvic tilt, wall: halebeinet under deg og setet på bakre bein strammet. Bare dette gir ofte mye strekk foran på bakre hofte.\n\n2. Hold tippen, og løft overkroppen langsomt mot loddrett, bare så langt som tippen holder.\n\n3. Hold i 60 sek. Pust rolig, og stram setet litt mer på hver utpust.\n\nDOSE: 2 × 60 sek per side, annenhver side.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: bekkenet tipper bakover og holdes der. Korsryggen står stille. Overkroppen reiser seg bare så langt bekkenet tillater.\n\nDET DU SKAL KJENNE: strekk foran på bakre hofte og nedover forsiden av låret.\n\nFEIL Å SE ETTER: korsryggen svaier når du reiser deg. Det er det vanligste for deg. Strekket forsvinner fra hofta og havner i ryggen. Gå tilbake fram og tipp bekkenet på nytt. Ribbeina spretter fram. Setet på bakre bein er slapt — da holder ikke tippen.\n\nHVORFOR IKKE FULL FRONTSPLITT? Det svakeste leddet bestemmer hvor langt du kommer, og korsryggen tar over. Hver del for seg nå, hele splitten som måling.",

"Elevated pancake":
"BØYDE KNÆR → STRAKERE, CONTRACT–RELAX.\n\nFORMÅL: bøye i hofta med nøytral rygg i straddle. Det er her målingen 2026-10-17 stoppet på 90°, altså at hofta ikke bøyde seg forbi sittende loddrett. Det er også stillingen pressen går gjennom.\n\nSTARTSTILLING: sitt på en forhøyning på 5–15 cm, for eksempel en yogablokk eller en sammenbrettet matte. Når setet er høyere enn føttene, er det lettere å tippe bekkenet fram. Beina bredt, men ikke helt ut. Knærne bøyd og hælene i gulvet. Kneskålene peker opp. Sitt på forkant av sittebeina, og tipp bekkenet fram så korsryggen får sin naturlige svai. Ryggen rett. Valgfritt: kosteskaftet langs ryggen, som i Hip hinge with dowel. Det sier fra når ryggen runder seg.\n\nBEVEGELSEN:\n\n1. Med bøyde knær: fold deg fram fra hofta med rett rygg, og gå med hendene fram i gulvet til du kjenner strekk på ca. 7 / 10.\n\n2. CONTRACT–RELAX: press hælene ned i gulvet i 5 sek, som om du prøver å dra dem mot deg. Slipp, pust ut, og gå litt lenger. Enten går hendene litt lenger fram, eller så skyver du hælene litt ut så knærne blir strakere. Ryggen holdes rett.\n\n3. 3 runder contract–relax, og så hold i 30 sek med rolig pust.\n\nDOSE: 2 sett, ca. 1,5 min per sett.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: bekkenet tipper fram rundt hofteleddene, og knærne strekkes gradvis. Ryggen er låst. Når du presser hælene ned, jobber de musklene som strekkes. Når du slipper, gir de etter litt mer. Det er derfor contract–relax virker.\n\nDET DU SKAL KJENNE: strekk i bakside og innside av lårene, ikke i ryggen.\n\nMERK: i Elevated hamstring stretch og Half split låser låret ryggen. Her finnes ingen slik lås, så du må holde ryggen rett selv. Det er derfor skaftet kan være nyttig.\n\nFEIL Å SE ETTER: ryggen runder seg for å komme lenger ned — da er det ryggen som bøyer seg og ikke hofta. Gå tilbake. Kneskålene ruller fram eller bakover. De skal peke opp. Du holder pusten når du presser. Prikking eller nervedrag bak kneet: stopp.",

"Seated straddle leg lifts":
"FORMÅL: styrke i ytterstillingen. Bevegelighet du ikke kan holde med egen kraft, kan du ikke bruke i en press. Når beina skal samles over hodet i pressen, er det hoftebøyerne som må jobbe i nettopp denne stillingen. De andre øvelsene gir mer rom, og denne lærer deg å bruke det.\n\nSTARTSTILLING: sitt på gulvet, uten forhøyning, med beina i straddle så bredt det går med strake knær. Kneskålene og tærne peker opp. Sitt rett opp, med bekkenet tippet fram og ryggen rett. Hendene i gulvet foran deg, mellom beina. Jo lenger fram hendene står, jo mer må hoftene gjøre jobben.\n\nBEVEGELSEN:\n\n1. Løft begge beina fra gulvet, noen få centimeter er nok. Knærne strake.\n\n2. Hold 1–2 sek, og senk dem kontrollert. Ikke slipp dem ned.\n\n3. Klarer du ikke begge: løft ett bein om gangen, vekselvis.\n\nDOSE: 3 × 8. Med ett bein: 3 × 8 per side. NOTER HVILKEN VARIANT DU KLARTE, OG HVOR HØYT BEINA KOM. Det er utgangspunktet.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: bare beina løfter seg. Overkroppen står stille og rett. Hendene er støtte, ikke drivkraft.\n\nDET DU SKAL KJENNE: at det brenner eller krever foran i hofta og øverst på lårene. Krampe foran i hofta er vanlig i starten. Rist den ut og fortsett.\n\nFEIL Å SE ETTER: du lener deg bakover for å få beina opp. Da blir det lettere, men da trener du ikke ytterstillingen. Det er den vanligste juksefeilen. Knærne bøyer seg. Beina ruller så kneskålene peker fram. Ryggen runder seg.",

"Block-squeeze kick-up to handstand":
"ONSDAGENS HOVEDØVELSE I BLOKK 2. Fra håndstandkurset (instruktøren Niko, 2026-10-28).\n\nFORMÅL: linjen i oppsparket. Blokka gir deg svar på hvert eneste forsøk: den blir bare sittende så lenge hofta på det beinet er bøyd og bekkenet tippet bakover. Svaier korsryggen, åpner vinkelen mellom lår og mage seg, og blokka faller. Det er bananryggen du får beskjed om. Det korte beinet gir også mindre fart enn to strake bein, så du må løfte hoftene over hendene i stedet for å slenge deg opp.\n\nOPPSETT: ryggen mot veggen, slik at du står med ryggen mot den i toppen. Stå lenger fra veggen enn i heel pulls, slik at balansen ligger hos deg og veggen bare er sikkerhetsnett. MÅL AVSTANDEN FRA HÅNDROTEN TIL VEGGEN FØRSTE GANG, OG HOLD DEN FAST. Yogablokk.\n\nSTARTSTILLING: blokka klemt mellom det ene låret og magen/ribbeina, kneet bøyd. Det andre beinet strakt. Hendene i gulvet, skuldrene over håndleddene, som i startstillingen for det vanlige oppsparket.\n\nBEVEGELSEN:\n\n1. Pust ut. Foten på blokk-beinet skyver fra gulvet, mens hofta på det beinet holdes bøyd og blokka klemt.\n\n2. Det strake beinet svinger opp til vertikal. Hoftene løftes OVER skuldrene før noe annet skjer.\n\n3. Sluttstilling: håndstand med det strake beinet loddrett, blokk-kneet inn mot magen og blokka fortsatt på plass. Ryggen rett, ribbeina inne.\n\n4. Hold litt hvis du kan, og kom rolig ned samme vei. Veggen tar deg hvis du går over.\n\nBEGGE SIDER (instruktørens råd):\n- Blokk på VENSTRE: venstre skyver, høyre svinger. Samme roller som det vanlige oppsparket ditt.\n- Blokk på HØYRE: høyre skyver, venstre svinger. Speilvendt, og det du trenger for å lære oppspark med venstre.\n\nDOSE: ett sett = 3 forsøk på samme side. Annenhver side per sett: V, H, V, H, V, H. 6 sett = 9 per side. Instruktøren sa 15 per bein. Vi starter lavere fordi kvaliteten din har falt etter ca. 20 oppspark før, og øker når kvaliteten holder.\n\nTELLER SOM GODT: blokka er på plass når du står i linje.\n\nDET DU SKAL KJENNE: magen og hofta på blokk-siden jobber for å holde blokka, også når du er oppe.\n\nFEIL Å SE ETTER: blokka faller i det du kommer opp — korsryggen svaier. Du hopper opp med fart i stedet for å flytte hoftene over hendene. Det strake beinet bøyer seg. Albuene bøyer seg.\n\nSTOPP-REGLER: to forsøk på rad der blokka faller eller formen ryker: avslutt settet. Kjenning foran og øverst på høyre skulder: stopp øvelsen for dagen.",

"Slow kick-up to handstand":
"PÅ PAUSE FRA 2026-11-06. Kjartans valg: én ny teknikk om gangen, float forward først. Frontsplitten er begrensningen han selv peker på.\n\nTORSDAGENS HOVEDØVELSE OG HOVEDMÅL 1 I BLOKK 2.\n\nFORMÅL: komme opp med tyngdepunktet over hendene FØR beina er oppe. Da er det nesten ingen fart når du når balansepunktet, og ingenting å overspark eller bli redd for. Det er også første halvdel av straddle pressen. Neste steg etter denne er pressen mot veggen.\n\nSTIGE:\n1. Føttene på boks (ca. 40–50 cm), ryggen mot veggen i toppen\n2. Lavere boks\n3. Fra gulvet, mot vegg. Hælen skal bare så vidt berøre veggen\n4. Fra gulvet, vegg 60–80 cm bak. Fingrene korrigerer, ingen bail\n5. Åpent gulv, bail som nødutgang\n\nNESTE TRINN: 5 av 5 myke ankomster på samme trinn. Starttrinnet testes i første økt.\n\nOPPSETT, TRINN 1: veggen, så hendene, så boksen. Hendene i gulvet ca. 15–20 cm fra veggen (håndroten), fingrene bort fra veggen. Boksen bak deg, så langt fra hendene at du står i en pike med hoftene høyt og føttene på boksen. Mål og noter både avstand til veggen og boksens høyde.\n\nSTARTSTILLING: pike med føttene på boksen, armene strake, skuldrene over håndleddene, hoftene høyt. Trepunktskontakt.\n\nBEVEGELSEN:\n\n1. Skyv gulvet bort, og la skuldrene lene seg litt fram, forbi håndleddene, i retning boksen. Det er motsatt vei av der beina skal. Skuldrene er motvekten som gjør at hoftene kan stige opp over hendene uten fart.\n\n2. Løft det ene beinet strakt og sakte opp. Det andre beinet gir bare et lett skyv fra boksen, eller ikke noe skyv i det hele tatt.\n\n3. Når hoftene står over hendene, følger det andre beinet etter. Beina samles i toppen.\n\n4. Ankomsten: hælen berører veggen lett, uten dunk. Det er det som teller.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: hendene står stille. Skuldrene lener seg litt fram mot boksen, og hoftene stiger opp over hendene. Beina kommer sist og går mot veggen.\n\nDET DU SKAL KJENNE: at vekten ligger i hendene og fingrene lenge før beina er oppe, og at fremsiden av skulderen jobber i lenet.\n\nKOBLINGEN TIL FRONTSPLITT: fra gulvet (trinn 3 og videre) er dette en frontsplitt. Ståbeinet ligger i hoftebøy med strakt kne, og sparkbeinet i hoftestrekk. Mangler splitten, gir noe annet etter: kneet bøyes, du hopper, eller korsryggen svaier. Derfor starter vi på boks, og derfor er hofteblokka samme dag.\n\nFEIL Å SE ETTER: du sparker med fart i stedet for å flytte hoftene — da er det et vanlig oppspark. Hælen dunker i veggen. Skuldrene lener seg ikke fram, så hoftene aldri kommer over hendene. Albuene bøyer seg.\n\nSTOPP-REGLER: to forsøk på rad med dunk eller hopp: avslutt settet. Kjenning foran og øverst på høyre skulder: stopp øvelsen for dagen. Lenet belaster nettopp fremsiden av skulderen.",

"Tuck handstand negative":
"VIDEO: https://youtube.com/shorts/VZH8Yvt5UgE\n\nNY 2026-11-06. Torsdag, først av float forward-drillene. Videoens drill 1.\n\nFORMÅL: float forward i revers. Du starter med hofta over hendene og øver den kontrollerte senkingen, altså landingen. Veggen tar deg hvis du tipper over.\n\nOPPSETT: som i oppspark mot vegg. Stå vendt mot veggen, hendene i gulvet med fingrene mot veggen, ca. 20–30 cm ut. Prøv deg fram og noter avstanden: ryggen skal kunne krumme seg i tuck uten å presses av veggen.\n\nBEVEGELSEN:\n\n1. Spark opp til håndstand med hælene mot veggen.\n\n2. Trekk knærne inn mot brystet til tuck. Hofta skal ligge over hendene, og føttene slipper veggen.\n\n3. Senk føttene mot gulvet på 3–5 sek. Mens beina går ned, lener skuldrene seg fram forbi fingrene, mot veggen. Hofta blir over hendene så lenge som mulig.\n\n4. Sett føttene ned mellom hendene, stille.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: hendene står stille. Beina senkes, skuldrene lener seg fram som motvekt, og hofta blir høyt.\n\nDET DU SKAL KJENNE: vekten i fingrene og fremsiden av skuldrene. Magen holder knærne inne.\n\nFEIL Å SE ETTER: hofta faller bak hendene, og du detter ned på beina. Armene bøyer seg. Rask senking.\n\nDOSE: 4 × 1, 60 sek hvile. Mest skulderlast i torsdagen. Kjenning foran og øverst på høyre skulder: stopp øvelsen for dagen.\n\nSØKETIPS: «tuck handstand negative» eller «tuck press negative».",
"Float forward from block":
"VIDEO: https://youtube.com/shorts/VZH8Yvt5UgE\n\nNY 2026-11-06. Torsdag, etter Bunny hops. Videoens drill 3.\n\nFORMÅL: selve float forward, gjort lettere. Blokka gjør at hofta starter høyt, så du kan øve på å flytte vekten over i hendene før føttene slipper.\n\nOPPSETT: yogablokk på laveste side. Stå med tærne på blokka, hendene flatt i gulvet ca. 30 cm foran blokka.\n\nBØYDE KNÆR: i videoen er beina strake. Det krever en framoverbøy du ikke har ennå. Bøy knærne akkurat så mye at hendene står flatt. Målet nå er hofta over hendene, ikke strake bein.\n\nBEVEGELSEN:\n\n1. Krum øvre rygg og press gulvet bort.\n\n2. Len skuldrene fram forbi håndleddene til vekten ligger i hendene og tærne nesten slipper blokka.\n\n3. Løft føttene av blokka og la dem flyte sakte ned mellom hendene. Ikke hopp. Føttene blir lette fordi vekten allerede er i hendene.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: hendene står stille. Skuldrene lener seg fram, og føttene følger etter.\n\nDET DU SKAL KJENNE: vekten i fingrene før føttene slipper.\n\nFEIL Å SE ETTER: du hopper ned fra blokka. Skuldrene står over eller bak håndleddene. Armene bøyer seg.\n\nTELLER: forsøk der hofta var over hendene før føttene slapp, og forsøk med lydløs landing. Av 8.\n\nSØKETIPS: «float forward yoga block» eller «ashtanga jump forward yoga block».",
"Standing pike pulses":
"NY 2026-11-06. Torsdag, siste øvelse i oppvarmingen.\n\nFORMÅL: åpne baksiden av låret rett før float forward. Strake bein i float forward krever framoverbøy med flate hender. Den lange bevegeligheten trenes i hofteblokka til slutt. Dette er bare oppvarming.\n\nSTARTSTILLING: stå med føttene samlet. Bøy fram med bøyde knær til brystet ligger mot lårene og hendene når gulvet eller leggene.\n\nBEVEGELSEN: hold brystet mot lårene og rett knærne gradvis, så langt det går uten at brystet slipper. Bøy knærne igjen. 10 rolige pulser, inn og ut av strekket. Ikke hold, ikke rykk.\n\nDET DU SKAL KJENNE: strekk bak på låret, ca. 7 / 10.\n\nFEIL Å SE ETTER: brystet slipper lårene når knærne rettes. Da strekkes ryggen, ikke låret. Prikking eller nervedrag bak kneet: stopp øvelsen.\n\nSØKETIPS: «standing pike pulses» eller «standing pike stretch».",
"Float forward from downward dog":
"VIDEO: https://youtube.com/shorts/VZH8Yvt5UgE\n\nHOVEDMÅL I BLOKK 2. Torsdag, til slutt i håndstanddelen: 2 forsøk som MÅLING. Film fra siden.\n\nFORMÅL: vektforskyvningen pressen starter med: hofta over hendene og vekten i hendene. Du lander på føttene, så det er ingen balanse å holde og ingenting å falle fra.\n\nSTIGE (skrevet om 2026-11-06, hofta først, landingen etterpå):\n1. Hofta over hendene: skuldrene foran håndleddene og vekten i hendene før føttene slipper. Hvor føttene lander, teller ikke ennå\n2. Føttene lander mellom hendene, bøyde knær. Dunk er greit\n3. Mellom hendene og lydløs landing\n4. Tuck-heng: kort pause med hofta over hendene før landing\n5. Med strake bein (pike). Krever framoverbøy med flate hender fra yogablokka\n\nKriteriet for å gå videre settes ca. 2026-11-13. Drillene før (Tuck handstand negative, Bunny hops, Float forward from block) trener bevegelsen. Disse 2 forsøkene viser hvor du står.\n\nSTARTSTILLING: Downward dog. Hendene i skulderbredde med trepunktskontakt, armene strake. Hoftene høyt.\n\nBEVEGELSEN:\n\n1. Bøy knærne og kom opp på tærne.\n\n2. Skyv gulvet bort med krum øvre rygg, og la skuldrene lene seg fram forbi håndleddene til vekten ligger i hendene og føttene blir lette.\n\n3. Løft hofta OPP, ikke fram, og trekk knærne inn mot brystet.\n\n4. La føttene flyte ned mellom hendene, så mykt du kan.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: hendene står stille. Skuldrene lener seg fram, hofta stiger, og knærne trekkes inn.\n\nDIAGNOSEN: dunk betyr at hofta ikke henger over hendene. Føttene utenfor hendene betyr at hofta er for lav eller knærne ikke kommer tett nok inn.\n\nFEIL Å SE ETTER: du hopper fram i stedet for opp. Armene bøyer seg. Skuldrene står bak hendene.\n\nSTOPP-REGEL: kjenning foran og øverst på høyre skulder: stopp øvelsen for dagen.",

"Prone body line hold on blocks":
"Fra håndstandkurset (instruktøren Niko, 2026-10-28). Utførelsen er avklart med Kjartan 2026-10-28.\n\nFORMÅL: håndstandslinjen liggende. Overkroppen og hofta henger fritt mellom to støttepunkter, og tyngdekraften drar magen ned. Gir du etter, svaier korsryggen, altså bananryggen. Holdet krever magemuskler, bekkenet tippet bakover og ribbeina inne, akkurat som opp ned.\n\nOPPSETT: to yogablokker. Én like over knærne. Én under albuene eller overarmene.\n\nSTARTSTILLING: ligg på magen over blokkene. Armene strake over hodet, som en pil. Blokkene er den eneste kontakten med gulvet.\n\nUTFØRELSE: stram magen, tipp bekkenet bakover, stram setet og trekk ribbeina inn. Hold kroppen rett som en pil. Pust rolig.\n\nDOSE: 3 × 15 sek, hvile 45 sek. Instruktøren: 3 × 10–15 sek.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: ingenting beveger seg. Det er et statisk hold.\n\nDET DU SKAL KJENNE: magen og setet jobber for å holde midten oppe. Skuldrene jobber også, fordi de bærer overkroppen med armene over hodet.\n\nFEIL Å SE ETTER: magen synker mot gulvet — korsryggen svaier. Hodet henger. Armene bøyer seg.\n\nSTOPP-REGEL: skulderen bærer overkroppen i full bøy over hodet. Kjenning foran og øverst på høyre skulder: stopp øvelsen for dagen.",

"Star side plank":
"FORMÅL: sidestabilitet i midtpartiet og skulderen. Det er den som hindrer at du vipper sidelengs når du står frittstående. Stjerna gjør det tyngre enn vanlig side plank, fordi støtteflaten blir mindre.\n\nSTARTSTILLING: på siden, støttet på strak arm med hånda rett under skulderen. Beina strake og stablet. Løft hoftene til kroppen er rett sett forfra.\n\nUTFØRELSE: løft det øverste beinet og den øverste armen, så kroppen danner en stjerne. Hold.\n\nDOSE: 3 × 20 sek per side, annenhver side. Klokka gir 6 × 20 sek.\n\nENKLERE VARIANT: går ikke stjerna, gjør vanlig side plank på strak arm, med beina samlet.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: hoftene står stille i linje. Bare det øverste beinet og armen løftes.\n\nFEIL Å SE ETTER: hofta synker eller roterer fram. Skulderen på støttearmen synker inn mot øret. Skyv gulvet bort.\n\nSTOPP-REGEL: høyre side bærer på høyre skulder. I testuka var den bare på venstre. Kjenning foran og øverst på høyre skulder: bare venstre side resten av dagen.",

"Advanced tuck":
"Erstatter Tuck compression hold, som var for lett (2026-09-23). Med knærne mot brystet ble den et skulderhold og ikke kompresjon.\n\nFORMÅL: kompresjon og støttestyrke i en lengre vektarm. Det er kvaliteten float forward og pressen trenger.\n\nOPPSETT: paralletter.\n\nUTFØRELSE: støtt deg opp på strake armer, skuldrene presset ned og bort fra ørene. Løft beina med bøyde knær, men skyv knærne ut foran deg så lårene ligger vannrett. Ryggen rett, ikke rundet. Leggene henger.\n\nDOSE: 3 × 10 sek, hvile 50 sek.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: ingenting. Statisk hold.\n\nDET DU SKAL KJENNE: foran i hofta og i magen. Jo lenger fram knærne er, jo tyngre.\n\nFEIL Å SE ETTER: knærne glir inn mot brystet — da er det den gamle, lette varianten. Ryggen runder seg. Skuldrene synker opp mot ørene.\n\nFOR TUNG: senk lårene litt, eller kortere hold. FOR LETT: strekk det ene beinet.",

"Seated pike leg lifts":
"FORMÅL: aktiv kompresjon med samlede bein. Det er hoftebøyerne og magen som skal trekke beina mot deg i float forward og i pressen.\n\nSTARTSTILLING: sitt på gulvet med beina samlet og strake. Kneskålene peker opp. Sitt rett opp, med bekkenet tippet fram. Hendene i gulvet ved siden av knærne eller leggene. Jo lenger fram hendene står, jo mer må hoftene gjøre jobben.\n\nBEVEGELSEN:\n\n1. Løft begge beina fra gulvet, noen få centimeter er nok. Knærne strake.\n\n2. Hold 1–2 sek, og senk kontrollert.\n\nDOSE: 3 × 8. Noter hvor høyt beina kom.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: bare beina. Overkroppen står stille og rett.\n\nDET DU SKAL KJENNE: det brenner foran i hofta og øverst på lårene. Krampe er vanlig i starten.\n\nFEIL Å SE ETTER: du lener deg bakover for å få beina opp. Knærne bøyer seg. Ryggen runder seg.",

"Wall straddle stretch":
"NY 2026-11-06. Erstatter «Straddle wall sit», som hadde et navn som ikke var søkbart og en contract–relax uten noe å presse mot. Torsdag, siste øvelse i hofteblokka.\n\nFORMÅL: innsiden av låret, altså straddlen. Den står på 105° (2026-10-17). Gulvet holder bekkenet og korsryggen i ro, så det er innsiden av låret som strekkes, ikke ryggen. Tyngdekraften trekker beina ut, så strekket har en last.\n\nSTARTSTILLING: ligg på ryggen med rumpa inntil veggen og beina rett opp langs veggen. Baksiden av beina mot veggen, strake knær, tærne peker rett ut fra veggen. Korsbeinet skal ligge i gulvet. Løfter det seg, flytt rumpa litt ut fra veggen.\n\nBEVEGELSEN:\n\n1. La beina gli ut til sidene langs veggen til ca. 7 / 10 i strekk. Tyngden gjør jobben.\n\n2. CONTRACT–RELAX: legg hendene på innsiden av lårene, så nær knærne du når. Press beina inn mot hendene i 5 sek. Hendene holder igjen, så beina ikke flytter seg. Slipp, pust ut, og la tyngden ta beina litt lenger ned.\n\n3. 3 runder, så hold resten av tiden med rolig pust.\n\nKOMME UT: før beina sammen med hendene på utsiden av knærne, eller bøy knærne og trekk dem inn. Ikke løft strake bein rett opp fra ytterstilling.\n\nDOSE: 2 × 90 sek.\n\nHVA BEVEGER SEG, HVA STÅR STILLE: bekken, rygg og rumpe ligger i ro mot gulv og vegg. Bare beina glir ut.\n\nDET DU SKAL KJENNE: strekk på innsiden av lårene, ikke i knærne og ikke i lysken.\n\nFEIL Å SE ETTER: korsbeinet løfter seg fra gulvet. Knærne bøyer seg. Smerte på innsiden av kneet: gå tilbake.\n\nMERK: posisjonen er liggende, ikke sittende som i målingen. Samme muskel, men tallene fra øvelsen kan ikke sammenlignes med målingen.\n\nSØKETIPS: «wall straddle stretch» eller «legs up the wall straddle».",

"Ring dip":
"UKE 3 (2026-11-16): RETEST. Siste tall er ca. 1 (2026-09-07), satt uten hollow-cue.\n\nOPPVARMING: Ring support hold 2 × 20 sek rett før.\n\nSTARTSTILLING: oppe på ringene med strake armer, ringene inntil kroppen og vridd litt utover. Skuldrene ned og bort fra ørene. Kroppen stram, ribbeina inne.\n\nBEVEGELSEN: senk kontrollert til overarmene er omtrent vannrette. Press opp til full lockout med ringene vridd ut.\n\nTESTEN: ett sett, maks strenge reps. Ingen kipping, ingen sparking. Stopp når en rep ikke blir ren, ikke når du er tom.\n\nFEIL Å SE ETTER: ringene glir ut fra kroppen. Skuldrene ruller fram og opp. Halv dybde.\n\nSTOPP-REGEL: kjenning foran og øverst på høyre skulder: avbryt testen."

const DAYNAME = { man: "Mandag", ons: "Onsdag", tor: "Torsdag", helg: "Helg", lor: "Lørdag" };
const DAYMAP = ["man", "ons", "ons", "tor", "helg", "helg", "helg"]; // man..søn — tirsdag viser onsdagens økt
const MEASURE_DAYS = ["2026-10-17", "2026-11-14", "2026-12-12"];  // målelørdager — appen åpner på «Måling» disse dagene
let day = MEASURE_DAYS.includes(iso(new Date())) ? "lor" : DAYMAP[(new Date().getDay() + 6) % 7];

const key = () => "okt:" + iso(new Date()) + ":" + day;
const load = () => { try { return JSON.parse(localStorage.getItem(key())) || {}; } catch (e) { return {}; } };
const save = s => { try { localStorage.setItem(key(), JSON.stringify(s)); } catch (e) {} };
const mmss = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
/* videolenker i INFO blir klikkbare — åpnes bare ved trykk, appen henter ingenting selv */
const linkify = t => esc(t).replace(/https:\/\/[^\s<]+/g, u => '<a href="' + u + '" target="_blank" rel="noopener" class="lnk">' + u + "</a>");

/* teknikkpanel — brukes både fra lista og fra runneren */
function visInfo(nm) {
  if (!INFO[nm]) return;
  document.getElementById("iTitle").textContent = nm;
  document.getElementById("iBody").innerHTML = linkify(INFO[nm]);
  document.getElementById("iBody").scrollTop = 0;
  document.getElementById("info").classList.add("on");
}

/* øvelse vises fra uke ex[3] og til og med uke ex[4] (begge valgfrie) */
const vis = (ex, w) => (!ex[3] || w >= ex[3]) && (!ex[4] || w <= ex[4]);

/* ---------- bygg stegliste for runner ---------- */
function buildSteps() {
  const w = weekNo(), L = ladder(w), out = [];
  let i = 0;
  for (const [bt, list] of S[day].blocks) {
    for (const ex of list) {
      if (!vis(ex, w)) continue;               // øvelse som bare gjelder enkelte uker
      const [nm, ds, t] = ex;
      const id = "e" + (i++);
      const d = (ds || "").replace("__BAIL__", L.bail).replace("__KICK__", L.kick);
      if (Array.isArray(t)) {
        const [sets, w, r] = t;
        for (let s = 1; s <= sets; s++) {
          out.push({ id, bt, nm, ds: d, sec: w, work: true, set: s, sets });
          if (s < sets) out.push({ id, bt, nm, ds: d, sec: r, work: false, set: s, sets });
        }
      } else {
        out.push({ id, bt, nm, ds: d, sec: t, work: true });
      }
    }
  }
  return out;
}
function totalSec() { return buildSteps().reduce((a, s) => a + s.sec, 0); }

/* ---------- liste ---------- */
function render() {
  const w = weekNo(), L = ladder(w), s = S[day], st = load();
  document.getElementById("wkLabel").textContent = (s.tag || "BLOKK 2 · UKE " + w + "/6") + " · " + s.title.toUpperCase();
  document.getElementById("dateLabel").textContent =
    new Date().toLocaleDateString("no-NO", { weekday: "long", day: "numeric", month: "short" })
    + " · " + mmss(totalSec()) + " · " + VERSION;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.d === day));
  const ri = resumeIdx(buildSteps(), st);
  document.getElementById("start").textContent = ri > 0 ? "▶ Fortsett økta" : "▶ Start økt";

  document.getElementById("banner").innerHTML = s.banner || "<b>Testuke 19.–25. oktober — høyre skulder</b>"
    + "<strong class='hl'>Stopp-regel: gjør en øvelse vondt i skulderen, stopper du den øvelsen i dag.</strong><br><br>"
    + s.note;

  let h = "", i = 0;
  for (const [bt, list] of s.blocks) {
    const shown = list.filter(ex => vis(ex, w));
    let bs = 0;
    for (const [, , t] of shown) bs += Array.isArray(t) ? t[0] * t[1] + (t[0] - 1) * t[2] : t;
    h += "<section><h2>" + bt + "<em>" + mmss(bs) + "</em></h2>";
    for (const [nm, ds, t] of shown) {
      const id = "e" + (i++);
      const d = (ds || "").replace("__BAIL__", L.bail).replace("__KICK__", L.kick);
      const tag = Array.isArray(t) ? t[0] + " × " + t[1] + "s" : mmss(t);
      const inf = INFO[nm];
      h += '<div class="ex' + (st[id] ? " done" : "") + '" data-id="' + id + '">'
        + '<div class="bx">✓</div><div class="tx"><div class="nm">' + nm + "</div>"
        + (d ? '<div class="ds">' + d + "</div>" : "") + "</div>"
        + '<span class="tg">' + tag + "</span>"
        + (inf ? '<button class="inf" data-inf="' + id + '">ⓘ</button>' : "")
        + "</div>"
        + (inf ? '<div class="infbox" id="inf-' + id + '">' + linkify(inf) + "</div>" : "");
    }
    h += "</section>";
  }
  if (s.meas) {
    h += "<section><h2>Noter nå<em>før du lukker appen</em></h2><div class='meas'>";
    if (s.measNote) h += "<div class='measnote'>" + esc(s.measNote) + "</div>";
    for (const [k, lab, ph] of s.meas)
      h += "<label>" + lab + "<input data-m='" + k + "' placeholder=\""
        + String(ph || "").replace(/"/g, "&quot;") + "\" value=\""
        + String(st["m_" + k] || "").replace(/"/g, "&quot;") + "\"></label>";
    h += "</div></section>";
  }
  document.getElementById("main").innerHTML = h;
}

/* ---------- lyd ---------- */
let AC = null;
function unlockAudio() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    g.gain.value = 0.0001; o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + 0.01);
  } catch (e) {}
}
function beep(freq, ms, vol) {
  if (!AC) return;
  try {
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol == null ? 0.35 : vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + ms / 1000 + 0.02);
  } catch (e) {}
}
const buzz = p => { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} };
const cue = () => { beep(950, 110, .28); buzz(35); };                                  // 3-2-1
const toWork = () => { beep(1250, 150); setTimeout(() => beep(1250, 260), 180); buzz([90, 60, 160]); };
const toRest = () => { beep(560, 420); buzz(220); };
/* øvelse ferdig — fallende treklang, tydelig forskjellig fra arbeid og hvile */
const toReady = () => { [[880, 0], [660, 190], [440, 380]].forEach(([f, d]) => setTimeout(() => beep(f, 300), d)); buzz([200, 100, 200]); };
const endAll = () => { [0, 200, 400].forEach((d, i) => setTimeout(() => beep(700 + i * 250, 300), d)); buzz([120, 80, 120, 80, 260]); };

/* ---------- runner ---------- */
let steps = [], idx = 0, endsAt = 0, left = 0, paused = true, loop = null, lastCue = -1, wake = null;
/* ready = ny øvelse venter på at han trykker Start. Gir tid til å flytte seg og rigge */
let ready = false;
/* lead = nedtelling fra Start-trykket til første serie, så han rekker å komme i posisjon */
const LEAD = 5;
let lead = false;

/* oppsummering av en hel øvelse, f.eks. "5 × 30 sek · hvile 45 sek" */
function exSummary(i) {
  const mine = steps.filter(s => s.id === steps[i].id);
  const work = mine.filter(s => s.work), rest = mine.filter(s => !s.work);
  if (work.length === 1) return "varighet " + mmss(work[0].sec);
  return work.length + " × " + work[0].sec + " sek" + (rest.length ? " · hvile " + rest[0].sec + " sek" : "");
}

/* Skjermen holdes våken så lenge appen er synlig — også når økta står på pause.
   Pause betyr at noe avbrøt ham og at han kommer tilbake; da er skjermlås verst.
   Nettleseren slipper låsen selv når sida skjules, derfor lytter vi på release
   og ber om den på nytt hver gang sida blir synlig igjen. */
async function keepAwake(on) {
  try {
    if (on) {
      if (!wake && document.visibilityState === "visible" && "wakeLock" in navigator) {
        wake = await navigator.wakeLock.request("screen");
        wake.addEventListener("release", () => { wake = null; });
      }
    } else if (wake) { await wake.release(); wake = null; }
  } catch (e) { wake = null; }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake(true);
});
/* Enkelte nettlesere krever et brukertrykk før første forespørsel */
document.addEventListener("click", () => keepAwake(true), { once: true });

/* Hvor økta skal fortsette etter et avbrudd: første øvelse som ikke er krysset av.
   Er det den samme øvelsen han sto i (lagret i pos), fortsettes det fra serien der,
   så han slipper å ta settene han alt har gjort. Står pos på en hvile, går vi til
   neste serie. Ingenting gjenstår: start fra begynnelsen. */
function resumeIdx(list, st) {
  const first = list.findIndex(s => !st[s.id]);
  if (first < 0) return 0;
  let p = st.pos;
  if (Number.isInteger(p) && list[p] && list[p].id === st.posId && st.posId === list[first].id) {
    if (!list[p].work && list[p + 1] && list[p + 1].id === st.posId) p++;
    return p;
  }
  return first;
}
/* resume = økta fortsetter etter avbrudd. Første steg venter på Start, som ved øvelsesbytte */
let resume = false;

function startRun() {
  steps = buildSteps();
  if (!steps.length) return;
  idx = resumeIdx(steps, load()); paused = false;
  resume = idx > 0;
  unlockAudio();
  const pb = document.getElementById("rPause");
  pb.textContent = "Pause"; pb.classList.remove("paused");
  document.getElementById("run").classList.add("on");
  keepAwake(true);
  enter();
  loop = setInterval(tick, 200);
}
function stopRun() {
  clearInterval(loop); loop = null; paused = true;
  /* skjermlåsen beholdes — appen er fortsatt åpen */
  document.getElementById("run").classList.remove("on");
  render();
}
function enter() {
  const s = steps[idx], prev = steps[idx - 1];
  left = s.sec; lastCue = -1; lead = false;
  { const st = load(); st.pos = idx; st.posId = s.id; save(st); }   // posisjonen overlever avbrudd og omstart av appen
  if (resume) { resume = false; ready = true; paint(); return; }

  /* Ny øvelse? Da venter vi på at han trykker Start.
     Innenfor en øvelse går seriene automatisk — han skal ikke måtte ta på
     telefonen mellom settene. Første steg i økta går rett til nedtellingen,
     fordi «Start økt» allerede var trykket. */
  const fresh = !prev || prev.id !== s.id;
  ready = fresh && !!prev;
  if (ready) { toReady(); paint(); return; }
  if (fresh) { beginLead(); return; }

  endsAt = Date.now() + s.sec * 1000;
  if (s.work) toWork(); else toRest();
  paint();
}
/* Start trykket: tell ned LEAD sek med 3-2-1, deretter starter første serie */
function beginLead() {
  ready = false; lead = true;
  left = LEAD; endsAt = Date.now() + LEAD * 1000; lastCue = -1;
  paint();
}
function tick() {
  if (paused || ready) return;
  left = Math.max(0, (endsAt - Date.now()) / 1000);
  const w = Math.ceil(left);
  if (w <= 3 && w >= 1 && w !== lastCue) { lastCue = w; cue(); }
  if (left <= 0 && lead) {
    const s = steps[idx];
    lead = false; left = s.sec; endsAt = Date.now() + s.sec * 1000; lastCue = -1;
    if (s.work) toWork(); else toRest();
    return paint();
  }
  if (left <= 0) return next(true);
  paint();
}
function next(auto) {
  if (idx >= steps.length - 1) {
    const st = load(); steps.forEach(s => st[s.id] = true); delete st.pos; delete st.posId; save(st);
    endAll(); stopRun(); toast("Økt fullført — trykk Logg");
    return;
  }
  const done = steps[idx];
  if (!steps.slice(idx + 1).some(s => s.id === done.id)) { const st = load(); st[done.id] = true; save(st); }
  idx++; enter();
}
function prev() { if (idx > 0) { idx--; enter(); } }

function paint() {
  const s = steps[idx], w = Math.ceil(left);
  document.getElementById("rCount").textContent = "steg " + (idx + 1) + " / " + steps.length;
  document.getElementById("rBlock").textContent = s.bt;
  document.getElementById("rName").textContent = s.nm;
  document.getElementById("rDesc").textContent = (ready || s.work) ? (s.ds || "") : "";

  const ph = document.getElementById("rPhase");
  document.getElementById("run").dataset.ph = (ready || lead) ? "ready" : s.work ? "work" : "rest";   // bakgrunnsfargen følger fasen
  const n = document.getElementById("rNum");
  const btn = document.getElementById("rPause");

  if (ready) {
    ph.textContent = "KLAR — RIGG DEG TIL";
    ph.className = "rphase ready";
    n.textContent = w >= 60 ? mmss(w) : w;
    n.className = "rnum idle";
    document.getElementById("rSet").textContent = s.sets && s.set > 1
      ? "fortsetter på serie " + s.set + " av " + s.sets          // gjenopptatt midt i øvelsen
      : exSummary(idx);
    btn.textContent = "▶ Start øvelsen";
    btn.classList.remove("paused");
  } else if (lead) {
    ph.textContent = "STARTER OM";
    ph.className = "rphase ready";
    n.textContent = w;
    n.className = "rnum" + (w <= 3 ? " warn" : "");
    document.getElementById("rSet").textContent = s.sets ? "serie " + s.set + " av " + s.sets : "";
    btn.textContent = paused ? "Fortsett" : "Pause";
    btn.classList.toggle("paused", paused);
  } else {
    ph.textContent = s.work ? "ARBEID" : "HVILE";
    ph.className = "rphase" + (s.work ? "" : " rest");
    n.textContent = w >= 60 ? mmss(w) : w;
    n.className = "rnum" + (w <= 3 ? " warn" : "");
    document.getElementById("rSet").textContent = s.sets ? "serie " + s.set + " av " + s.sets : "";
    btn.textContent = paused ? "Fortsett" : "Pause";
    btn.classList.toggle("paused", paused);
  }

  document.getElementById("rInfo").style.display = INFO[s.nm] ? "" : "none";

  const nx = steps[idx + 1];
  document.getElementById("rNext").textContent = nx ? "Neste: " + (nx.work ? nx.nm : "hvile " + nx.sec + " sek") : "Siste steg";
  document.getElementById("rBar").style.width = (ready ? 0 : 100 * (1 - left / (lead ? LEAD : s.sec))) + "%";
}

document.getElementById("rInfo").onclick = () => visInfo(steps[idx].nm);
document.getElementById("iClose").onclick = () => document.getElementById("info").classList.remove("on");

document.getElementById("start").onclick = startRun;
document.getElementById("rQuit").onclick = () => { if (confirm("Avslutte økta?")) stopRun(); };
document.getElementById("rPrev").onclick = prev;
document.getElementById("rNextBtn").onclick = () => next(false);
document.getElementById("rPause").onclick = () => {
  keepAwake(true);                       // aldri slipp låsen på pause
  if (ready) { beginLead(); return; }
  paused = !paused;
  if (paused) left = Math.max(0, (endsAt - Date.now()) / 1000);
  else endsAt = Date.now() + left * 1000;
  paint();
};

/* ---------- liste-interaksjon ---------- */
document.addEventListener("click", e => {
  const nav = e.target.closest("nav button");
  if (nav) { day = nav.dataset.d; render(); return; }
  const ib = e.target.closest("[data-inf]");           // må sjekkes før .ex, ellers krysses øvelsen av
  if (ib) { document.getElementById("inf-" + ib.dataset.inf).classList.toggle("on"); return; }
  const ex = e.target.closest(".ex");
  if (ex) {
    const st = load(); st[ex.dataset.id] = !st[ex.dataset.id]; save(st);
    ex.classList.toggle("done", !!st[ex.dataset.id]);
    if (st[ex.dataset.id]) buzz(12);
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset.m) { const st = load(); st["m_" + e.target.dataset.m] = e.target.value; save(st); }
});

function toast(m) {
  const t = document.getElementById("toast");
  t.textContent = m; t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 2400);
}

document.getElementById("copy").onclick = async () => {
  const st = load(), s = S[day], w = weekNo();
  let done = 0, tot = 0, lines = [], i = 0;
  for (const [bt, list] of s.blocks) {
    const hit = [];
    for (const [nm] of list.filter(ex => vis(ex, w))) { const id = "e" + (i++); tot++; if (st[id]) { done++; hit.push(nm); } }
    if (hit.length) lines.push("- " + bt + ": " + hit.join(" · "));
  }
  const wd = new Date().toLocaleDateString("no-NO", { weekday: "long" });
  let txt = "/okt\n\n## " + iso(new Date()) + " — " + wd.charAt(0).toUpperCase() + wd.slice(1) + ", " + s.title + " (" + (s.logTag || "blokk 2, uke " + w + "/6") + ")\n"
    + lines.join("\n") + "\n- Gjennomført: " + done + " av " + tot + " øvelser\n";
  if (s.meas) {
    const m = s.meas
      .filter(([k]) => k !== "rpe")
      .map(([k, lab]) => st["m_" + k] ? "  - " + lab + ": " + st["m_" + k] : null)
      .filter(Boolean);
    if (m.length) txt += "- Måling:\n" + m.join("\n") + "\n";
  }
  txt += "- RPE: " + (st["m_rpe"] || "") + "\n- Form: \n- Notat: ";
  try { await navigator.clipboard.writeText(txt); toast("Kopiert — lim inn til Claude"); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Kopiert — lim inn til Claude"); } catch (e2) { toast("Kunne ikke kopiere"); }
    ta.remove();
  }
};
document.getElementById("reset").onclick = () => { if (confirm("Nullstille avkryssingen for i dag?")) { save({}); render(); } };

render();
keepAwake(true);        // skjermen holdes våken fra appen åpnes, ikke først når økta starter
</script>
</body>
</html>
